        "404":
          $ref: "#/components/responses/ErrorResponse"
  /patients/{patientId}/shares:
    get:
      summary: List consent and data-access grants for one patient
      description: >
        Returns backend-classified patient consent, direct clinician grants, and
        administrative workspace assignments, including recipient, lifecycle,
        and audit metadata. Revoked and expired records remain visible.
      parameters:
        - in: path
          name: patientId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tenant-scoped patient access ledger
          content:
            application/json:
              schema:
                type: object
                required: [shares]
                properties:
                  shares:
                    type: array
                    items:
                      $ref: "#/components/schemas/PatientShare"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    post:
      summary: Grant patient data access
      description: >
        The backend derives authorityType from the authenticated actor and
        recipient. Clients cannot self-declare patient consent.
      parameters:
        - in: path
          name: patientId
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            maxLength: 160
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientShareMutation"
      responses:
        "201":
          description: Access grant created, or the original result replayed
          headers:
            Idempotency-Replayed:
              description: Present and true when the original mutation result was replayed
              schema:
                type: string
                enum: ["true"]
          content:
            application/json:
              schema:
                type: object
                required: [share, replayed]
                properties:
                  share:
                    $ref: "#/components/schemas/PatientShare"
                  replayed:
                    type: boolean
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /patients/{patientId}/shares/{shareId}:
    delete:
      summary: Revoke one patient consent or data-access grant
      description: >
        Revocation is immutable lifecycle history; the grant remains in the
        ledger with backend-provided revoke actor and timestamp.
      parameters:
        - in: path
          name: patientId
          required: true
          schema:
            type: string
        - in: path
          name: shareId
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            maxLength: 160
      responses:
        "200":
          description: Access grant revoked, or the original result replayed
          headers:
            Idempotency-Replayed:
              description: Present and true when the original mutation result was replayed
              schema:
                type: string
                enum: ["true"]
          content:
            application/json:
              schema:
                type: object
                required: [revoked, share, replayed]
                properties:
                  revoked:
                    type: boolean
                    enum: [true]
                  share:
                    $ref: "#/components/schemas/PatientShare"
                  replayed:
                    type: boolean
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /audit-logs:
    get:
      summary: List the canonical append-only audit ledger
      description: >
        Platform administrators may query an explicit workspace. Workspace
        owners and administrators are restricted to their current operational
        workspace. Free-text search covers canonical identity/action/resource
        columns only and never searches raw metadata.
      parameters:
        - in: query
          name: organizationId
          schema:
            type: string
        - in: query
          name: q
          schema:
            type: string
            maxLength: 160
        - in: query
          name: action
          schema:
            type: string
            maxLength: 120
        - in: query
          name: resourceType
          schema:
            type: string
            maxLength: 120
        - in: query
          name: actorUserId
          schema:
            type: string
            maxLength: 120
        - in: query
          name: startDate
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          schema:
            type: string
            format: date
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: sort
          schema:
            type: string
            enum: [createdAt:desc, createdAt:asc, action:asc, action:desc]
            default: createdAt:desc
      responses:
        "200":
          description: Server-filtered and tenant-scoped audit page
          headers:
            X-Total-Count:
              schema:
                type: integer
            X-Page:
              schema:
                type: integer
            X-Page-Limit:
              schema:
                type: integer
            X-Page-Count:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: object
                required: [logs, pagination]
                properties:
                  logs:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditLog"
                  pagination:
                    $ref: "#/components/schemas/PageMetadata"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
  /access-logs:
    get:
      deprecated: true
      summary: Compatibility alias for the canonical audit ledger
      description: >
        Compatibility-window alias for GET /audit-logs. It returns the same
        tenant-scoped AuditLog records, filters and pagination contract.
      parameters:
        - in: query
          name: organizationId
