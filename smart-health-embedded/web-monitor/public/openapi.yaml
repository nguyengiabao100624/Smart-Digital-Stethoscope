        queuedAt:
          type: string
          maxLength: 40
        deliveredAt:
          type: string
          maxLength: 40
        acknowledgedAt:
          type: string
          maxLength: 40
        applyingAt:
          type: string
          maxLength: 40
        appliedAt:
          type: string
          maxLength: 40
        failedAt:
          type: string
          maxLength: 40
        expiredAt:
          type: string
          maxLength: 40
