openapi: 3.0.3
info:
  title: Smart Health Backend API
  version: 0.4.0
  description: Versioned Shcare HTTP contract for public, workspace and platform surfaces under /api/v1.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Health check
      responses:
        "200":
          description: Backend status
  /auth/login:
    post:
      security: []
      summary: Login with demo account credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login:
                  type: string
                password:
                  type: string
                role:
                  type: string
                  enum: [doctor, patient]
      responses:
        "200":
          description: Session token and user profile
  /auth/firebase:
    get:
      summary: Verify Firebase ID token and return mapped backend user
      description: Requires Authorization bearer token from Firebase Authentication.
      responses:
        "200":
          description: Firebase provider, mapped user, and backend auth session
  /auth/role-request:
    post:
      summary: Request doctor or patient role review for the current Firebase user
      responses:
        "200":
          description: Updated user and role request status
  /auth/workspace-request:
    post:
      summary: Submit or resubmit a pending workspace registration
      description: Creates or updates the current patient's owned workspace request. Exact retries return the persisted receipt; reusing the key with different input returns 409.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceRequestInput"
      responses:
        "201":
          description: Canonical workspace request receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceRequestReceipt"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /auth/sessions:
    get:
      summary: List active/revoked auth sessions for the current user
      responses:
        "200":
          description: Session list
  /auth/sessions/{sessionId}/revoke:
    post:
      summary: Revoke one auth session belonging to the current user
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Revoked session
  /doctor/dashboard:
    get:
      summary: Doctor dashboard summary
      responses:
        "200":
          description: Dashboard stats and recent scans
  /doctor/patients:
    get:
      summary: List patients available to the doctor
      responses:
        "200":
          description: Patient list
    post:
      summary: Create a patient record
      responses:
        "201":
          description: Created patient
  /patients/import/validate:
    post:
      summary: Validate and preview one patient CSV import batch
      description: >
        Accepts a UTF-8 CSV file up to 5 MiB and 5,000 data rows. Validation
        persists a tenant-scoped batch for 24 hours but does not create any
        patient. Exact retries with the same Idempotency-Key return the same
        batch; reusing the key for different file content returns 409.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - in: header
          name: X-File-Name
          required: false
          schema:
            type: string
            maxLength: 240
        - in: query
          name: workspaceId
          required: false
          description: Platform-admin override; workspace users remain scoped to their current membership.
          schema:
            type: string
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Persisted validation preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientImportValidationResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "413":
          $ref: "#/components/responses/ErrorResponse"
        "415":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
  /patients/import/{batchId}:
    get:
      summary: Read a tenant-scoped patient import validation batch
      parameters:
        - in: path
          name: batchId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current batch state and row preview
          content:
            application/json:
              schema:
                type: object
                required: [batch]
                properties:
                  batch:
                    $ref: "#/components/schemas/PatientImportBatch"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /patients/import/{batchId}/commit:
    post:
      summary: Atomically commit a validated patient import batch
      description: >
        Creates every patient and the audit receipt in one transaction. A
        duplicate found after validation fails the whole batch. The response
        is successful only after all rows are committed.
      parameters:
        - in: path
          name: batchId
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Atomic commit receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientImportCommitResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "410":
          $ref: "#/components/responses/ErrorResponse"
  /doctor/scans:
    get:
      summary: List scans available to the doctor
      parameters:
        - in: query
          name: patientId
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          description: Scan list
  /doctor/scans/start:
    post:
      summary: Start a scan for a patient
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
      responses:
        "201":
          description: Scan started
  /patient/dashboard:
    get:
      summary: Patient dashboard scoped to current session
      responses:
        "200":
          description: Patient stats and recent scans
  /patient/scans:
    get:
      summary: List scans belonging to the current patient
      responses:
        "200":
          description: Patient scan list
  /scans:
    get:
      summary: List scans with production filters
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: patientId
          schema:
            type: string
        - in: query
          name: deviceId
          schema:
            type: string
        - in: query
          name: createdFrom
          schema:
            type: string
        - in: query
          name: createdTo
          schema:
            type: string
      responses:
        "200":
          description: Filtered scans
    post:
      summary: Create a durable scan session before chunk upload
      responses:
        "201":
          description: Created scan session
  /scans/{scanId}/audio-chunks:
    post:
      summary: Upload one PCM audio chunk for a scan
      description: >
        Appends one contiguous audio chunk. Reusing the same Idempotency-Key with
        the same scan, sequence, digest and payload returns the original result.
        This remains true after completion closes the upload ledger. Reusing it
        with different input, overwriting a committed sequence, or skipping a
        sequence returns 409. Each chunk is capped at 1 MiB; one scan is capped
        at 32 MiB and 32,768 chunks. Limit violations return 413 before a file
        or ledger row is committed.
      parameters:
        - in: path
          name: scanId
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: true
          description: Stable key for this exact chunk mutation.
          schema:
            type: string
            minLength: 1
            maxLength: 160
        - in: header
          name: X-Chunk-Sequence
          required: true
          description: Zero-based contiguous sequence number. The first chunk is 0.
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 32767
        - in: header
          name: X-Chunk-SHA256
          required: true
          description: SHA-256 digest of the exact request body, encoded as 64 hexadecimal characters.
          schema:
            type: string
            pattern: "^[0-9A-Fa-f]{64}$"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              maxLength: 1048576
      responses:
        "200":
          description: Chunk accepted or exact idempotent replay.
          headers:
            Idempotency-Replayed:
              description: Present with value `true` when the original response is replayed.
              schema:
                type: string
                enum: ["true"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanAudioChunkUploadResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "413":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /scans/{scanId}/complete:
    post:
      summary: Complete chunk upload and process audio
      description: >
        Atomically closes a contiguous upload ledger and starts or completes
        processing. An exact retry with the same Idempotency-Key returns the
        persisted response and does not enqueue duplicate work. A processing
        completion has a 15-minute lease measured from updatedAt; an exact
        retry after expiry may reclaim it atomically with a new internal lease
        token, while retries before expiry report in progress.
      parameters:
        - in: path
          name: scanId
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: true
          description: Stable key for this exact completion mutation.
          schema:
            type: string
            minLength: 1
            maxLength: 160
      responses:
        "200":
          description: Persisted scan state, either newly completed/queued or replayed.
          headers:
            Idempotency-Replayed:
              description: Present with value `true` when the persisted completion response is replayed.
              schema:
                type: string
                enum: ["true"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanAudioCompletionResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "413":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /scans/{scanId}/reprocess:
    post:
      summary: Reprocess one persisted scan artifact
      description: >
        Creates a new processing generation for a new Idempotency-Key. An exact
        retry with the same actor, workspace, scan and key replays the persisted
        generation. Processing intent, generation, artifact fingerprint and run
        identity are durable so a restart cannot silently collapse distinct jobs.
      parameters:
        - in: path
          name: scanId
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: true
          description: Stable key for this exact reprocess mutation.
          schema:
            type: string
            minLength: 1
            maxLength: 160
      responses:
        "200":
          description: Newly accepted/completed generation or exact replay.
          headers:
            Idempotency-Replayed:
              description: Present with value `true` for an exact replay.
              schema:
                type: string
                enum: ["true"]
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /scans/{scanId}/audio-url:
    get:
      summary: Return authorized signed URL or local object URL
      parameters:
        - in: path
          name: scanId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Audio access URL
  /patient/scans/start:
    post:
      summary: Start a scan for the current patient
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
      responses:
        "201":
          description: Scan started
  /patient/scans/{scanId}:
    get:
      summary: Read one patient-owned scan
      parameters:
        - in: path
          name: scanId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Scan detail
  /devices/provision-qr:
    post:
      summary: Create a claim code payload for a device QR
      responses:
        "201":
          description: Claim payload with deviceId and claimCode
  /devices/pair:
    post:
      summary: Pair or claim a device
      responses:
        "200":
          description: Paired device without secret fields
  /admin/overview-stats:
    get:
      summary: Read a tenant-scoped platform or workspace overview
      description: Snapshot metrics stay current while scan and signal-processing metrics are restricted to the requested real timestamp range. The chart bucket total always equals stats.scansCount.
      parameters:
        - $ref: "#/components/parameters/OverviewRange"
        - $ref: "#/components/parameters/TimezoneOffsetMinutes"
      responses:
        "200":
          description: Truthful overview snapshot and range-scoped time series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
  /portal/overview:
    get:
      summary: Read the current workspace overview
      description: Workspace alias of the overview contract with tenant filtering applied by backend membership.
      parameters:
        - $ref: "#/components/parameters/OverviewRange"
        - $ref: "#/components/parameters/TimezoneOffsetMinutes"
      responses:
        "200":
          description: Current workspace overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
  /admin/clinics:
    get:
      summary: List canonical workspaces
      description: Platform administrators can list all workspaces. Other authorized actors are tenant-scoped. `/admin/workspaces` remains a compatibility alias.
      parameters:
        - in: query
          name: q
          schema:
            type: string
            maxLength: 160
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/WorkspaceStatus"
        - in: query
          name: workspaceType
          schema:
            $ref: "#/components/schemas/WorkspaceType"
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: sort
          schema:
            type: string
            enum: [name:asc, name:desc, status:asc, status:desc, createdAt:asc, createdAt:desc, updatedAt:asc, updatedAt:desc, version:asc, version:desc]
      responses:
        "200":
          description: Workspace page. Pagination is returned in X-Total-Count, X-Page, X-Page-Limit and X-Page-Count headers.
          headers:
            X-Total-Count:
              schema:
                type: integer
            X-Page:
              schema:
                type: integer
            X-Page-Limit:
              schema:
                type: integer
            X-Page-Count:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: object
                required: [workspaces, clinics]
                properties:
                  workspaces:
                    type: array
                    items:
                      $ref: "#/components/schemas/Workspace"
                  clinics:
                    type: array
                    items:
                      $ref: "#/components/schemas/Workspace"
        "403":
          $ref: "#/components/responses/ErrorResponse"
    post:
      summary: Create a pending workspace
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceCreateInput"
      responses:
        "201":
          description: Canonical create receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMutationReceipt"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
  /admin/clinics/{workspaceId}:
    parameters:
      - in: path
        name: workspaceId
        required: true
        schema:
          type: string
    patch:
      summary: Update workspace fields or perform one lifecycle transition
      description: Field updates, owner transfers, and status transitions must be sent as separate operations. Every versioned update requires Idempotency-Key and expectedVersion/If-Match.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - in: header
          name: If-Match
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/WorkspacePatchInput"
                - $ref: "#/components/schemas/WorkspaceTransitionInput"
                - $ref: "#/components/schemas/WorkspaceOwnerTransferInput"
      responses:
        "200":
          description: Canonical update or transition receipt
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WorkspaceMutationReceipt"
                  - $ref: "#/components/schemas/WorkspaceOwnerTransferReceipt"
        "409":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      summary: Archive an inactive workspace
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - in: header
          name: If-Match
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Canonical archive receipt and persisted tombstone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceArchiveReceipt"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /admin/clinics/{workspaceId}/owner-approval:
    post:
      summary: Confirm the pending workspace owner identity
      description: Provider-backed owner identity and active workspace_owner membership are confirmed before the separate pending-to-active transition. The workspace version does not change in this preparation step.
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
        - in: header
          name: If-Match
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion]
              properties:
                expectedVersion:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Canonical owner approval receipt; workspace remains pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceOwnerApprovalReceipt"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /admin/doctor-requests:
    get:
      summary: List doctor approval requests
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [all, pending, approved, rejected, needs_info]
      responses:
        "200":
          description: Doctor approval requests
        "403":
          $ref: "#/components/responses/ErrorResponse"
  /admin/doctor-requests/{requestId}/approve:
    post:
      summary: Approve a doctor account request
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approved doctor request
        "403":
          $ref: "#/components/responses/ErrorResponse"
  /admin/doctor-requests/{requestId}/reject:
    post:
      summary: Reject a doctor account request
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rejected doctor request
        "400":
          $ref: "#/components/responses/ErrorResponse"
  /admin/doctor-requests/{requestId}/request-info:
    post:
      summary: Request additional doctor profile information
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Doctor request moved to needs_info
        "400":
          $ref: "#/components/responses/ErrorResponse"
  /admin/staff-invitations:
    get:
      summary: List tenant-scoped staff invitations
      description: Workspace staff managers are always restricted to their current workspace. Platform user managers may filter by workspace or omit the filter to list all workspaces.
      parameters:
        - in: query
          name: organizationId
          schema:
            type: string
        - in: query
          name: role
          schema:
            type: string
            enum: [workspace_admin, doctor, nurse, technician, billing, viewer]
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, accepted, revoked, expired]
      responses:
        "200":
          description: Staff invitation ledger without acceptance secrets
          content:
            application/json:
              schema:
                type: object
                required: [invitations]
                properties:
                  invitations:
                    type: array
                    items:
                      $ref: "#/components/schemas/StaffInvitation"
        "403":
          $ref: "#/components/responses/ErrorResponse"
    post:
      summary: Create a staff invitation
      description: The raw acceptance token and URL are returned exactly once. An exact idempotent replay returns HTTP 200 and omits both secret fields.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffInvitationCreateInput"
      responses:
        "201":
          description: Invitation created; delivery truth and one-time acceptance material are included
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffInvitationMutationResponse"
        "200":
          description: Exact idempotent replay without acceptance material
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                enum: ["true"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffInvitationMutationResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /admin/staff-invitations/{invitationId}/resend:
    post:
      summary: Rotate and resend a pending or expired staff invitation
      description: Rotates the stored token hash. The new raw token and URL are returned only on the first successful mutation, never on an idempotent replay.
      parameters:
        - in: path
          name: invitationId
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Resent invitation or exact replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffInvitationMutationResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /admin/staff-invitations/{invitationId}/revoke:
    post:
      summary: Revoke a pending or expired staff invitation
      parameters:
        - in: path
          name: invitationId
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        "200":
          description: Revoked invitation or exact replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffInvitationMutationResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /staff-invitations/accept:
    post:
      summary: Accept a staff invitation as the authenticated matching email
      description: Creates the workspace membership, updates the backend account role, consumes the invitation and audits the mutation in one repository transaction.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 32
