openapi: 3.0.3
info:
  title: Shcare Backend API
  version: 0.5.0
  description: Versioned Shcare HTTP contract for public, workspace and platform surfaces under /api/v1.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Health check
      responses:
        "200":
          description: Backend status
  /auth/login:
    post:
      security: []
      summary: Login with demo account credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login:
                  type: string
                password:
                  type: string
                role:
                  type: string
                  enum: [doctor, patient]
      responses:
        "200":
          description: Session token and user profile
  /auth/firebase:
    get:
      summary: Verify Firebase ID token and return mapped backend user
      description: Requires Authorization bearer token from Firebase Authentication.
      responses:
        "200":
          description: Firebase provider, mapped user, and backend auth session
  /auth/role-request:
    post:
      summary: Request doctor or patient role review for the current Firebase user
      description: >
        The authenticated account is always the request owner; userId, actorUserId,
        firebaseUid and operationId are never accepted from the client. A stable
        Idempotency-Key is required. Exact retries return the original canonical
        user/lifecycle receipt and operationId without duplicating the audit event
        or approval notification. The legacy /api/auth/role-request path and
        request field aliases remain available during the compatibility window.
        When organizationId is supplied it is authoritative and fail-closed: the
        backend never falls back to hospital/clinic display text, and clinicId
        cannot select a different workspace. The legacy clinic name/ID alias
        remains accepted but cannot override organizationId. Pending doctor
        requests do not create an operational membership or affect operational
        workspace counts.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequestInput"
      responses:
        "200":
          description: Canonical account-owned role request receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleRequestReceipt"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /auth/role-request-document:
    post:
      summary: Upload one verification document for the authenticated role-request owner
      description: >
        Accepts PDF, JPEG or PNG bytes up to 10 MiB. Idempotency is scoped to
        the authenticated account and exact file name, content type, byte size
        and SHA-256 content digest. Exact retries return the original receipt
        without creating another storage object, document record or audit event.
        An account may retain at most ten verification documents.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - in: header
          name: X-File-Name
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 240
      requestBody:
        required: true
        content:
          application/pdf:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Account- and workspace-bound upload receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleRequestDocumentReceipt"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /auth/workspace-request:
    post:
      summary: Submit or resubmit a pending workspace registration
      description: Creates or updates the current patient's owned workspace request. Exact retries return the persisted receipt; reusing the key with different input returns 409.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceRequestInput"
      responses:
        "201":
          description: Canonical workspace request receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceRequestReceipt"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /auth/sessions:
    get:
      summary: List active/revoked auth sessions for the current user
      responses:
        "200":
          description: Session list
  /auth/sessions/{sessionId}/revoke:
    post:
      summary: Revoke one auth session belonging to the current user
      description: >
        Requires a stable caller-supplied Idempotency-Key scoped to the
        authenticated backend user. An exact retry returns the original
        revocation outcome without another audit row. Reusing the key for a
        different session returns 409, while a session owned by another
        account is indistinguishable from a missing session and returns 404.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Canonical revocation receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionRevokeReceipt"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /me/2fa:
    get:
      summary: Read authenticator availability and the current account's 2FA state
      responses:
        "200":
          description: Provider availability and canonical 2FA state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorStatusResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
  /me/2fa/enroll:
    post:
      summary: Start an app-authenticator enrollment for the current account
      description: >
        Requires a stable Idempotency-Key header bound to the authenticated account
        and primary session. An exact retry returns the same pending enrollment;
        a different key atomically supersedes any live pending enrollment, including
        recovery-acknowledgement-pending state. Bootstrap plaintext is returned to
        the caller but is never persisted in plaintext. 2FA remains disabled until
        recovery-code acknowledgement succeeds.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                method:
                  type: string
                  enum: [app]
      responses:
        "201":
          description: Pending authenticator enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorEnrollmentResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /me/2fa/verify:
    post:
      summary: Verify the authenticator and stage recovery delivery
      description: >
        Requires a stable Idempotency-Key bound to the authenticated account,
        enrollment, exact OTP input and primary session. Exact retries within the
        bounded delivery window return the same recovery codes and one-time
        recovery acknowledgement token. This response keeps 2FA disabled and does
        not grant a completed second-factor session. Recovery plaintext, pending
        token plaintext, and the Idempotency-Key are never persisted or logged.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorVerifyRequest"
      responses:
        "200":
          description: Exact account/enrollment-bound recovery delivery receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorVerifiedReceipt"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "410":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /me/2fa/recovery-codes/ack:
    post:
      summary: Acknowledge secure storage of the current recovery-code delivery
      description: >
        Uses the original enrollment Idempotency-Key, one-time recoveryAckToken,
        and primary-session binding. The atomic commit acknowledges delivery,
        enables 2FA, and creates the bounded completed second-factor token. The
        response never contains recovery-code or acknowledgement-token plaintext.
        Exact retries return the same enabled receipt without another audit row.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorRecoveryAckRequest"
      responses:
        "200":
          description: Owner-bound acknowledgement receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorRecoveryAckReceipt"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "410":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /me/2fa/disable:
    post:
      summary: Disable 2FA after validating a current authenticator or recovery code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                code:
                  type: string
                recoveryCode:
                  type: string
              oneOf:
                - required: [code]
                - required: [recoveryCode]
      responses:
        "200":
          description: Disabled 2FA state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorDisabledResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /me:
    get:
      summary: Read the authenticated account profile
      responses:
        "200":
          description: Authenticated account state
        "401":
          $ref: "#/components/responses/ErrorResponse"
    patch:
      summary: Update only the authenticated account's profile fields
      description: >
        The backend derives the owner from the authenticated session. Exact
        retries return the original bounded profile snapshot and never expose
        credentials, Firebase claims, 2FA material or avatar storage metadata.
        Workspace switching, avatar mutation and notification preferences use
        their dedicated contracts.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountProfileUpdateRequest"
      responses:
        "200":
          description: Exact owner-bound account profile mutation receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountProfileUpdateReceipt"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /me/avatar:
    get:
      summary: Download the authenticated account's active avatar
      responses:
        "200":
          description: Owner-authorized avatar bytes
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/ErrorResponse"
    post:
      summary: Upload an exact owner-bound account avatar
      description: >
        Accepts at most 2 MiB of JPEG, PNG or WebP bytes. The declared content
        type, extension and file signature must agree. Metadata, account state,
        audit, idempotency receipt and the previous-object cleanup saga commit in
        one repository transaction. Cleanup may truthfully remain pending for
        bounded reconciliation without rolling back the active avatar.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - in: header
          name: X-File-Name
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 240
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
              maxLength: 2097152
          image/png:
            schema:
              type: string
              format: binary
              maxLength: 2097152
          image/webp:
            schema:
              type: string
              format: binary
              maxLength: 2097152
      responses:
        "201":
          description: Exact avatar upload receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarUploadReceipt"
        "200":
          description: Exact idempotent replay receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarUploadReceipt"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "413":
          $ref: "#/components/responses/ErrorResponse"
        "415":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      summary: Remove the exact active owner-bound avatar
      description: >
        The expected avatar file identity prevents a stale screen from deleting a
        newer upload. Account state, metadata, audit, idempotency receipt and the
        provider-cleanup saga commit atomically; provider cleanup is reconciled
        separately and its state is returned without a false success claim.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvatarDeleteInput"
      responses:
        "200":
          description: Exact avatar deletion receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarDeleteReceipt"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /me/avatar/cleanup:
    get:
      summary: Read the authenticated account's durable avatar cleanup state
      description: >
        Returns only the canonical account's latest unresolved cleanup state.
        Pending cleanup is retried by the backend worker; dead-letter cleanup
        requires manual support and is never reported as completed.
      responses:
        "200":
          description: Owner and current-workspace-scoped avatar cleanup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarCleanupStatus"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /me/password:
    post:
      summary: Change the authenticated account password
      description: >
        Requires the explicit Idempotency-Key header and the same active account
        that opened the security screen. Secrets are compared exactly and are
        never trimmed. Firebase changes also require an authoritative
        signInWithPassword proof bound to the canonical Firebase UID and email;
        auth_time alone is not accepted. Exact completed retries return the
        persisted receipt without repeating the provider mutation, audit row or
        notification; reusing the key with a different body returns 409.
        Firebase password updates revoke refresh tokens automatically. If a
        provider call may have started but its result was not durably recorded,
        the operation fails closed with
        IDENTITY_PROVIDER_RECONCILIATION_REQUIRED and is never executed again
        automatically. After a completed change, a client whose original token
        was revoked may sign in with the new password and retry the exact
        original body and Idempotency-Key to recover the persisted receipt.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeRequest"
      responses:
        "200":
          description: Closed password-change receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordChangeReceipt"
        "400":
          description: Invalid password input, current password, or Idempotency-Key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordChangeError"
        "401":
          description: >
            Authentication or recent-login failure. Stable recovery codes include
            FIREBASE_ID_TOKEN_REVOKED, FIREBASE_ID_TOKEN_EXPIRED,
            FIREBASE_REAUTH_REQUIRED and FIREBASE_RECENT_LOGIN_REQUIRED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordChangeError"
        "403":
          description: Account, authority, or Firebase proof mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordChangeError"
        "409":
          description: Idempotency conflict, invalid receipt, or provider reconciliation required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordChangeError"
        "503":
          description: >
            Provider/storage unavailable, or password fingerprint HMAC key is not
            configured. Stable codes include FIREBASE_PASSWORD_VERIFIER_UNAVAILABLE
            and PASSWORD_IDEMPOTENCY_HMAC_KEY_UNAVAILABLE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordChangeError"
  /me/notification-preferences:
    get:
      summary: Read account-wide notification preferences and channel readiness
      description: >
        Returns only the authenticated account's canonical preferences. Provider
        credentials, registration tokens and notification session identifiers are
        never exposed.
      responses:
        "200":
          description: Canonical notification preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalNotificationPreferencesResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
    patch:
      summary: Update exactly one account-wide notification preference
      description: >
        The mutation is account-owned and never accepts a user or workspace target.
        Sound and vibration are Android device-local settings and are not accepted.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonalNotificationPreferencePatch"
      responses:
        "200":
          description: Backend-confirmed notification preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalNotificationPreferencesResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /notifications/inbox:
    get:
      summary: Read the authenticated account's notification inbox
      description: >
        Returns at most 200 in-app notifications owned by the authenticated
        account and projected into its active canonical workspace. Disabled or
        skipped in-app rows, credentials, provider tokens and deep links are
        never returned.
      responses:
        "200":
          description: Canonical personal notification inbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalNotificationInboxResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      summary: Delete every item in the current personal inbox
      description: >
        Atomically removes only the authenticated account's notifications in
        its active canonical workspace. The response includes the complete
        post-mutation snapshot and an idempotent replay receipt.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Backend-confirmed delete-all receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalNotificationInboxMutationResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /notifications/inbox/read-all:
    post:
      summary: Mark every item in the current personal inbox as read
      description: >
        Persists the scoped notification changes, audit event and replay receipt
        atomically. The response is the complete backend-confirmed post-mutation
        inbox snapshot.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Backend-confirmed read-all receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalNotificationInboxMutationResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /notifications/inbox/{notificationId}/read:
    post:
      summary: Mark one current-workspace notification as read
      description: >
        Fails closed when the item belongs to another account or a stale
        workspace. Clients replace their local state only with the returned
        canonical snapshot.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - in: path
          name: notificationId
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 160
      responses:
        "200":
          description: Backend-confirmed read receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalNotificationInboxMutationResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /notifications/inbox/{notificationId}:
    delete:
      summary: Delete one notification from the current personal inbox
      description: >
        The item is removed only after an owner/workspace-scoped transaction
        commits the delete, audit event and idempotency receipt.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - in: path
          name: notificationId
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 160
      responses:
        "200":
          description: Backend-confirmed delete receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalNotificationInboxMutationResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /doctor/dashboard:
    get:
      summary: Doctor dashboard summary
      responses:
        "200":
          description: Dashboard stats and recent scans
  /doctor/patients:
    get:
      summary: List patients available to the doctor
      responses:
        "200":
          description: Patient list
    post:
      summary: Create a patient record
      responses:
        "201":
          description: Created patient
  /patients:
    get:
      summary: List patients visible in the authenticated actor's canonical workspace
      parameters:
        - $ref: "#/components/parameters/AdminListQ"
        - $ref: "#/components/parameters/AdminListPage"
        - $ref: "#/components/parameters/AdminListLimit"
        - $ref: "#/components/parameters/AdminListSort"
      responses:
        "200":
          description: Workspace-bound patient list
          headers:
            X-Total-Count:
              $ref: "#/components/headers/AdminListTotal"
            X-Page:
              $ref: "#/components/headers/AdminListPage"
            X-Page-Limit:
              $ref: "#/components/headers/AdminListLimit"
            X-Page-Count:
              $ref: "#/components/headers/AdminListPageCount"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [workspaceId, patients]
                properties:
                  workspaceId:
                    type: string
                  patients:
                    type: array
                    maxItems: 5000
                    items:
                      $ref: "#/components/schemas/PatientMutationPatient"
        "403":
          $ref: "#/components/responses/ErrorResponse"
    post:
      summary: Create a patient and return an actor/workspace-bound mutation receipt
      description: >
        Exact retries return the original canonical patient snapshot with replayed=true.
        The authenticated backend actor supplies userId and the backend-selected patient
        workspace supplies workspaceId; neither value is accepted from the JSON body.
        Personal/family callers must pin the current account, workspace and backend auth
        session in the three X-Shcare-Expected-* headers before dispatch.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/PatientExpectedUserId"
        - $ref: "#/components/parameters/PatientExpectedWorkspaceId"
        - $ref: "#/components/parameters/PatientExpectedAuthSessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientMutationInput"
      responses:
        "201":
          description: Canonical create receipt or exact replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientMutationReceipt"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /patients/{patientId}:
    parameters:
      - in: path
        name: patientId
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 120
    get:
      summary: Read one accessible patient
      responses:
        "200":
          description: Canonical patient
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [patient]
                properties:
                  patient:
                    $ref: "#/components/schemas/PatientMutationPatient"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    patch:
      summary: Update a patient and return an actor/workspace-bound mutation receipt
      description: Exact retries return the original canonical updated patient snapshot.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/PatientExpectedUserId"
        - $ref: "#/components/parameters/PatientExpectedWorkspaceId"
        - $ref: "#/components/parameters/PatientExpectedAuthSessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientMutationInput"
      responses:
        "200":
          description: Canonical update receipt or exact replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientMutationReceipt"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      summary: Delete a non-self patient and return an actor/workspace-bound receipt
      description: >
        A replay is accepted only for the original authenticated actor in the
        receipt's canonical workspace. A stale cross-workspace replay fails closed.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/PatientExpectedUserId"
        - $ref: "#/components/parameters/PatientExpectedWorkspaceId"
        - $ref: "#/components/parameters/PatientExpectedAuthSessionId"
      responses:
        "200":
          description: Canonical delete receipt or exact replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientMutationReceipt"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /patients/import/validate:
    post:
      summary: Validate and preview one patient CSV import batch
      description: >
        Accepts a UTF-8 CSV file up to 5 MiB and 5,000 data rows. Validation
        persists a tenant-scoped batch for 24 hours but does not create any
        patient. Exact retries with the same Idempotency-Key return the same
        batch; reusing the key for different file content returns 409.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - in: header
          name: X-File-Name
          required: false
          schema:
            type: string
            maxLength: 240
        - in: query
          name: workspaceId
          required: false
          description: Platform-admin override; workspace users remain scoped to their current membership.
          schema:
            type: string
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Persisted validation preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientImportValidationResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "413":
          $ref: "#/components/responses/ErrorResponse"
        "415":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
  /patients/import/{batchId}:
    get:
      summary: Read a tenant-scoped patient import validation batch
      parameters:
        - in: path
          name: batchId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current batch state and row preview
          content:
            application/json:
              schema:
                type: object
                required: [batch]
                properties:
                  batch:
                    $ref: "#/components/schemas/PatientImportBatch"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /patients/import/{batchId}/commit:
    post:
      summary: Atomically commit a validated patient import batch
      description: >
        Creates every patient and the audit receipt in one transaction. A
        duplicate found after validation fails the whole batch. The response
        is successful only after all rows are committed.
      parameters:
        - in: path
          name: batchId
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Atomic commit receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientImportCommitResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "410":
          $ref: "#/components/responses/ErrorResponse"
  /doctor/scans:
    get:
      summary: List scans available to the doctor
      parameters:
        - in: query
