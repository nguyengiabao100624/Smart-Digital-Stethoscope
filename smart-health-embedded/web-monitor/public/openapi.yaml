  /admin/storage-files/{fileId}/download:
    parameters:
      - in: path
        name: fileId
        required: true
        schema:
          type: string
    get:
      summary: Download an authorized tenant-scoped storage object
      responses:
        "200":
          description: File bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "302":
          description: Redirect to an HTTPS provider URL
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
components:
  responses:
    ErrorResponse:
      description: Standard API error. Top-level message/code fields are kept for old clients.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  parameters:
    AdminListQ:
      in: query
      name: q
      required: false
      description: Case-insensitive free-text search across the fields allowed by the endpoint.
      schema:
        type: string
        maxLength: 240
    AdminListPage:
      in: query
      name: page
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    AdminListLimit:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    AdminListSort:
      in: query
      name: sort
      required: false
      description: Endpoint-specific field followed by asc or desc.
      schema:
        type: string
        pattern: '^[A-Za-z][A-Za-z0-9]*:(asc|desc)$'
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 160
    PatientExpectedUserId:
      in: header
      name: X-Shcare-Expected-User-Id
      required: false
      description: >
        Required for personal/family patient mutations. Exact authenticated account
        captured by the client before dispatch; ignored only for non-personal workspace
        management callers.
      schema:
        type: string
        minLength: 1
        maxLength: 160
    PatientExpectedWorkspaceId:
      in: header
      name: X-Shcare-Expected-Workspace-Id
      required: false
      description: >
        Required for personal/family patient mutations. Canonical active workspace
        captured by the client before dispatch.
      schema:
        type: string
        minLength: 1
        maxLength: 160
    PatientExpectedAuthSessionId:
      in: header
      name: X-Shcare-Expected-Auth-Session-Id
      required: false
      description: >
        Required for personal/family patient mutations. Opaque backend auth-session ID
        captured before dispatch; it is neither a bearer credential nor a JSON-body field.
      schema:
        type: string
        minLength: 1
        maxLength: 160
    AppointmentId:
      in: path
      name: appointmentId
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 120
    OverviewRange:
      in: query
      name: range
      required: false
      description: Calendar range interpreted in timezoneOffsetMinutes.
      schema:
        type: string
        enum: [today, 7d, 30d]
        default: today
    TimezoneOffsetMinutes:
      in: query
      name: timezoneOffsetMinutes
      required: false
      description: Integer minutes east of UTC, for example 420 for Asia/Ho_Chi_Minh.
      schema:
        type: integer
        minimum: -720
        maximum: 840
        default: 0
  headers:
    AdminListTotal:
      description: Total records matching the active filters before paging.
      schema:
        type: integer
        minimum: 0
    AdminListPage:
      description: Requested page.
      schema:
        type: integer
        minimum: 1
    AdminListLimit:
      description: Effective page limit.
      schema:
        type: integer
        minimum: 1
        maximum: 100
    AdminListPageCount:
      description: Total pages matching the active filters.
      schema:
        type: integer
        minimum: 0
  schemas:
    TwoFactorState:
      type: object
      additionalProperties: false
      required: [enabled, method, enrollmentPending]
      properties:
        enabled:
          type: boolean
        method:
          type: string
          enum: ["", app]
        enrollmentPending:
          type: boolean
    TwoFactorEnabledState:
      type: object
      additionalProperties: false
      required: [enabled, method, enrollmentPending]
      properties:
        enabled:
          type: boolean
          enum: [true]
        method:
          type: string
          enum: [app]
        enrollmentPending:
          type: boolean
          enum: [false]
    TwoFactorPendingState:
      type: object
      additionalProperties: false
      required: [enabled, method, enrollmentPending]
      properties:
        enabled:
          type: boolean
          enum: [false]
        method:
          type: string
          enum: [""]
        enrollmentPending:
          type: boolean
          enum: [true]
    TwoFactorDisabledState:
      type: object
      additionalProperties: false
      required: [enabled, method, enrollmentPending]
      properties:
        enabled:
          type: boolean
          enum: [false]
        method:
          type: string
          enum: [""]
        enrollmentPending:
          type: boolean
          enum: [false]
    TwoFactorAvailability:
      type: object
      additionalProperties: false
      required: [available, status, methods, reason]
      properties:
        available:
          type: boolean
        status:
          type: string
          enum: [available, unavailable]
        methods:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [app]
        reason:
