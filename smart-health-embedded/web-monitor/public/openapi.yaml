    PatientShareMutation:
      type: object
      description: >
        Exactly one recipient must be provided: doctorUserId for a direct
        clinician grant, or organizationId for an administrative workspace
        assignment. Patient actors granting direct access are recorded as
        patient consent by the backend.
      oneOf:
        - required: [doctorUserId]
        - required: [organizationId]
      properties:
        doctorUserId:
          type: string
        organizationId:
          type: string
        accessLevel:
          type: string
          enum: [read]
          default: read
        purpose:
          type: string
          maxLength: 2000
        scope:
          type: string
          enum: [patient_profile, selected_scans]
          default: patient_profile
        scanIds:
          type: array
          uniqueItems: true
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
    PatientShare:
      type: object
      required:
        [id, patientId, accessLevel, authorityType, purpose, scope, scanIds, status, active, recipient, audit, createdAt, updatedAt]
      properties:
        id:
          type: string
        patientId:
          type: string
        doctorUserId:
          type: string
        organizationId:
          type: string
        accessLevel:
          type: string
          enum: [read]
        authorityType:
          type: string
          enum: [patient_consent, clinician_access_grant, administrative_assignment]
        purpose:
          type: string
        consentedAt:
          type: string
          description: Empty for non-consent grants.
        scope:
          type: string
          enum: [patient_profile, selected_scans]
        scanIds:
          type: array
          uniqueItems: true
          items:
            type: string
        expiresAt:
          type: string
        revokedAt:
          type: string
        status:
          type: string
          enum: [active, revoked, expired]
        active:
          type: boolean
        recipient:
          $ref: "#/components/schemas/PatientShareRecipient"
        grantedByActor:
          allOf:
            - $ref: "#/components/schemas/PatientShareActor"
          nullable: true
        revokedByActor:
          allOf:
            - $ref: "#/components/schemas/PatientShareActor"
          nullable: true
        audit:
          $ref: "#/components/schemas/PatientShareAudit"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PatientShareRecipient:
