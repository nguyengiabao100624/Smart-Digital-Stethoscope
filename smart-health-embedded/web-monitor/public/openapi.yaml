        retentionDays:
          type: number
          minimum: 0
        features:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [active, archived]
    ServicePackageMutationResponse:
      type: object
      required: [package]
      properties:
        package:
          $ref: "#/components/schemas/ServicePackage"
        idempotent:
          type: boolean
    PatientImportIssue:
      type: object
      required: [field, code, message, severity]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
        severity:
          type: string
          enum: [error]
    PatientImportPatientPreview:
      type: object
      required: [id, patientCode, name, dateOfBirth, gender, phone, email, address, bloodType, allergies, emergencyContact, notes, profileType]
      properties:
        id:
          type: string
        patientCode:
          type: string
        name:
          type: string
        dateOfBirth:
          type: string
        gender:
          type: string
          enum: ["", male, female, other, unknown]
        phone:
          type: string
        email:
          type: string
        address:
          type: string
        bloodType:
          type: string
        allergies:
          type: array
          items:
            type: string
        emergencyContact:
          type: object
          additionalProperties:
            type: string
        notes:
          type: string
        profileType:
          type: string
          enum: [patient]
    PatientImportRow:
      type: object
      required: [rowNumber, status, issues, patient]
      properties:
        rowNumber:
          type: integer
          minimum: 2
        status:
          type: string
          enum: [valid, invalid]
        issues:
          type: array
          items:
            $ref: "#/components/schemas/PatientImportIssue"
        patient:
          $ref: "#/components/schemas/PatientImportPatientPreview"
    PatientImportBatch:
      type: object
      required: [id, organizationId, fileName, fileSizeBytes, status, rowCount, validCount, invalidCount, duplicateCount, importedCount, patientIds, rows, version, expiresAt, committedAt, createdAt, updatedAt]
      properties:
        id:
          type: string
        organizationId:
          type: string
        fileName:
          type: string
        fileSizeBytes:
          type: integer
          minimum: 1
          maximum: 5242880
        status:
          type: string
          enum: [validated, invalid, committed, expired]
        rowCount:
          type: integer
          minimum: 0
          maximum: 5000
        validCount:
          type: integer
          minimum: 0
        invalidCount:
          type: integer
          minimum: 0
        duplicateCount:
          type: integer
          minimum: 0
        importedCount:
          type: integer
          minimum: 0
        patientIds:
          type: array
          items:
            type: string
        rows:
          type: array
          maxItems: 5000
          items:
            $ref: "#/components/schemas/PatientImportRow"
        version:
          type: integer
          minimum: 1
        expiresAt:
          type: string
          format: date-time
        committedAt:
          type: string
          description: Empty until commit succeeds.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PatientImportValidationResponse:
      type: object
      required: [batch, replayed]
      properties:
        batch:
          $ref: "#/components/schemas/PatientImportBatch"
        replayed:
          type: boolean
    PatientImportCommitResponse:
      type: object
      required: [batch, importedCount, patientIds, replayed]
      properties:
        batch:
          $ref: "#/components/schemas/PatientImportBatch"
        importedCount:
          type: integer
          minimum: 0
        patientIds:
          type: array
          items:
            type: string
        replayed:
          type: boolean
    PatientShareMutation:
      type: object
      description: >
        Exactly one recipient must be provided: doctorUserId for a direct
        clinician grant, or organizationId for an administrative workspace
        assignment. Patient actors granting direct access are recorded as
        patient consent by the backend.
      oneOf:
        - required: [doctorUserId]
        - required: [organizationId]
      properties:
        doctorUserId:
          type: string
        organizationId:
          type: string
        accessLevel:
          type: string
          enum: [read]
          default: read
        purpose:
          type: string
          maxLength: 2000
        scope:
          type: string
          enum: [patient_profile, selected_scans]
          default: patient_profile
        scanIds:
          type: array
          uniqueItems: true
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
    PatientShare:
      type: object
      required:
        [id, patientId, accessLevel, authorityType, purpose, scope, scanIds, status, active, recipient, audit, createdAt, updatedAt]
      properties:
        id:
          type: string
        patientId:
          type: string
        doctorUserId:
          type: string
        organizationId:
          type: string
        accessLevel:
          type: string
          enum: [read]
        authorityType:
          type: string
          enum: [patient_consent, clinician_access_grant, administrative_assignment]
        purpose:
          type: string
        consentedAt:
          type: string
          description: Empty for non-consent grants.
        scope:
          type: string
          enum: [patient_profile, selected_scans]
        scanIds:
          type: array
          uniqueItems: true
          items:
            type: string
        expiresAt:
          type: string
        revokedAt:
          type: string
        status:
          type: string
          enum: [active, revoked, expired]
        active:
          type: boolean
        recipient:
          $ref: "#/components/schemas/PatientShareRecipient"
        grantedByActor:
          allOf:
            - $ref: "#/components/schemas/PatientShareActor"
          nullable: true
        revokedByActor:
          allOf:
            - $ref: "#/components/schemas/PatientShareActor"
          nullable: true
        audit:
          $ref: "#/components/schemas/PatientShareAudit"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PatientShareRecipient:
      type: object
      required: [type, id, name, workspaceId]
      properties:
        type:
          type: string
          enum: [doctor, workspace]
        id:
          type: string
        name:
          type: string
        workspaceId:
          type: string
    PatientShareActor:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
    PatientShareAudit:
      type: object
      required: [grantedAt, grantedByUserId, revokedAt, revokedByUserId]
      properties:
        grantedAt:
          type: string
        grantedByUserId:
          type: string
        revokedAt:
          type: string
        revokedByUserId:
          type: string
    PageMetadata:
      type: object
      required: [page, limit, total, pageCount, hasNextPage, sort]
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        pageCount:
          type: integer
          minimum: 0
        hasNextPage:
          type: boolean
        sort:
          type: string
    AuditLog:
      type: object
      required:
        [id, actorUserId, actorName, actorRole, organizationId, organizationName, action, resourceType, resourceId, outcome, ip, userAgent, metadata, createdAt]
      properties:
        id:
          type: string
        actorUserId:
          type: string
        actorName:
          type: string
        actorRole:
          type: string
        organizationId:
          type: string
        organizationName:
          type: string
        action:
          type: string
        resourceType:
          type: string
        resourceId:
          type: string
        outcome:
          type: string
          enum: [success, failure, warning, denied, recorded]
        ip:
          type: string
        userAgent:
          type: string
        metadata:
          type: object
          description: Recursively redacted metadata safe for authorized display.
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    ExportJob:
      type: object
      required:
        [id, organizationId, format, dataset, scopeKind, filters, rendererVersion, status, recordCount, artifactByteSize, artifactSha256, createdAt]
      properties:
        id:
          type: string
        organizationId:
          type: string
          description: Empty only for a platform-global audit_logs export.
        createdByUserId:
          type: string
        format:
          type: string
          enum: [json, csv, xlsx, pdf]
        dataset:
          type: string
          enum: [clinical_bundle, audit_logs]
        scopeKind:
          type: string
          enum: [platform, workspace, assigned_patients, personal]
        filters:
          type: object
          additionalProperties: true
        rendererVersion:
          type: string
          enum: [shcare.export-artifact.v1]
        status:
          type: string
          enum: [pending, ready, failed]
        includeAudio:
          type: boolean
        includeReports:
          type: boolean
        includeHistory:
          type: boolean
        startDate:
          type: string
          format: date
          nullable: true
        endDate:
          type: string
          format: date
          nullable: true
        recordCount:
          type: integer
          minimum: 0
        artifactByteSize:
          type: integer
          minimum: 0
        artifactSha256:
          type: string
          pattern: "^$|^[0-9a-f]{64}$"
        downloadUrl:
          type: string
        downloadedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ExportSnapshot:
      type: object
      required: [schemaVersion, exportId, dataset, generatedAt, scope, filters, counts, data]
      properties:
        schemaVersion:
          type: string
          enum: [shcare.export.v1]
        exportId:
          type: string
        dataset:
          type: string
          enum: [clinical_bundle, audit_logs]
        generatedAt:
          type: string
          format: date-time
        scope:
          type: object
          required: [organizationId, kind, actorUserId, patientIds]
          properties:
            organizationId:
              type: string
            workspaceId:
              type: string
            kind:
              type: string
              enum: [platform, workspace, assigned_patients, personal]
            actorUserId:
              type: string
            patientIds:
              type: array
              items:
                type: string
        filters:
          type: object
          additionalProperties: true
          properties:
            startDate:
              type: string
            endDate:
              type: string
            includeAudio:
              type: boolean
            includeReports:
              type: boolean
            includeHistory:
              type: boolean
            q:
              type: string
            action:
              type: string
            resourceType:
              type: string
            actorUserId:
              type: string
            sort:
              type: string
        counts:
          type: object
          required: [total]
          additionalProperties:
            type: integer
            minimum: 0
        data:
          type: object
          properties:
            patients:
              type: array
              items:
                type: object
                additionalProperties: true
            devices:
              type: array
              items:
                type: object
                additionalProperties: true
            scans:
              type: array
              items:
                type: object
                additionalProperties: true
            appointments:
              type: array
              items:
                type: object
                additionalProperties: true
            reports:
              type: array
              items:
                type: object
                additionalProperties: true
            audioFiles:
              type: array
              items:
                type: object
                additionalProperties: true
            auditLogs:
              type: array
              items:
                $ref: "#/components/schemas/AuditLog"
    ScanAudioChunkUploadResponse:
      type: object
      required: [scan, chunk, uploadedBytes, nextSequence, replayed]
      properties:
        scan:
          type: object
          additionalProperties: true
        chunk:
          type: object
          required: [id, sequence, sha256, byteSize, createdAt]
          properties:
            id:
              type: string
            sequence:
              type: integer
              minimum: 0
            sha256:
              type: string
              pattern: "^[0-9a-f]{64}$"
            byteSize:
              type: integer
              minimum: 1
            createdAt:
              type: string
              format: date-time
        uploadedBytes:
          type: integer
          minimum: 1
        nextSequence:
          type: integer
          minimum: 1
        replayed:
          type: boolean
    ScanAudioCompletionResponse:
      type: object
      required: [scan]
      properties:
        scan:
          type: object
          additionalProperties: true
    ErrorEnvelope:
      type: object
      required: [error, message, code, statusCode, requestId]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              example: FORBIDDEN
            message:
              type: string
              example: Khong co quyen truy cap.
            requestId:
              type: string
              example: req_lx0e9f_7a8b9c0d
        message:
          type: string
        code:
          type: string
        statusCode:
          type: integer
        requestId:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
