<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2457d6" />
    <meta
      name="description"
      content="Shcare — nền tảng Smart Health Care theo dõi tim phổi từ xa, quản lý thiết bị, hồ sơ lượt đo và quyền truy cập theo workspace."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shcare" />
    <meta property="og:url" content="https://shcare.web.app/" />
    <meta property="og:image" content="https://shcare.web.app/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://shcare.web.app/og-image.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <title>Shcare | Theo dõi tim phổi từ xa</title>
    <script>
      (() => {
        try {
          const storageKey = "shcare-theme";
          const legacyKey = "lovable-theme";
          let preference = localStorage.getItem(storageKey);
          const legacy = localStorage.getItem("lovable-theme");
          if (!["light", "dark", "system"].includes(preference)) {
            preference = ["light", "dark"].includes(legacy) ? legacy : "system";
          }
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const resolvedTheme = preference === "system"
            ? (prefersDark ? "dark" : "light")
            : preference;
          document.documentElement.classList.toggle("dark", resolvedTheme === "dark");
          document.documentElement.classList.toggle("light", resolvedTheme === "light");
          document.documentElement.dataset.theme = preference;
          document.documentElement.dataset.resolvedTheme = resolvedTheme;
          document.documentElement.style.colorScheme = resolvedTheme;
          localStorage.setItem(storageKey, preference);
          localStorage.removeItem(legacyKey);
        } catch {
          const fallbackDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", fallbackDark);
          document.documentElement.classList.toggle("light", !fallbackDark);
          document.documentElement.dataset.theme = "system";
          document.documentElement.dataset.resolvedTheme = fallbackDark ? "dark" : "light";
          document.documentElement.style.colorScheme = fallbackDark ? "dark" : "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Bạn cần bật JavaScript để sử dụng Shcare.</noscript>
    <script type="module" src="/src/spa-main.tsx"></script>
  </body>
</html>
