          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /admin/storage-files/{fileId}/share:
    parameters:
      - in: path
        name: fileId
        required: true
        schema:
          type: string
    post:
      summary: Create an audited 15-minute HTTPS signed URL when the S3 provider is available
      parameters:
