name: Smart Health CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-monitor/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run smoke:storage
      - run: npm run smoke:mqtt
      - run: npm run smoke:api-production

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install platformio
      - run: platformio run
        working-directory: MSM261S4030H0
