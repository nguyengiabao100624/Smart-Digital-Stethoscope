[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_port = COM6
monitor_port = COM6
monitor_dtr = 0
monitor_rts = 0

; Keep WiFi/server credentials out of source code.
; For local flashing, copy these examples into your own ignored local command or
; uncomment and replace values before upload:
; build_flags =
;   -DSMART_HEALTH_WIFI_SSID=\"YourWiFi\"
;   -DSMART_HEALTH_WIFI_PASS=\"YourPassword\"
;   -DSMART_HEALTH_BACKEND_HOST=\"api.smart-health.example.com\"
;   -DSMART_HEALTH_BACKEND_PORT=443
;   -DSMART_HEALTH_BACKEND_TLS=1
;   -DSMART_HEALTH_DEVICE_ID=\"smarthealth-ABCDEF\"
;   -DSMART_HEALTH_DEVICE_SECRET=\"device-secret-issued-by-web-admin\"
;   -DSMART_HEALTH_FIRMWARE_VERSION=\"1.0.0\"
; Optional local UDP fallback for development only:
;   -DSMART_HEALTH_AUDIO_HOST=\"192.168.1.100\"
;   -DSMART_HEALTH_AUDIO_UDP_PORT=3001
; Optional LAN ArduinoOTA for development only:
;   -DSMART_HEALTH_ENABLE_LAN_OTA=1
;   -DSMART_HEALTH_OTA_PASSWORD=\"local-dev-ota-password\"

board_build.flash_size = 16MB
board_build.flash_mode = dio

lib_deps =
  gilmaimon/ArduinoWebsockets

[env:esp32-s3-ota]
extends = env:esp32-s3-devkitm-1
upload_protocol = espota
; Replace after the first wired flash and setup portal save.
; Examples:
; upload_port = smarthealth-ABCDEF.local
; upload_port = 192.168.1.42
; Keep the real OTA password out of source. Temporarily uncomment locally only:
; upload_flags =
;   --auth=replace-with-device-ota-password
