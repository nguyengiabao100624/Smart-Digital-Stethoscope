        "404":
          $ref: "#/components/responses/ErrorResponse"
        "502":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /patient/scans/start:
    post:
      summary: Start a scan for the current patient
      description: Exact retries return the original scan; payload mismatch for the same key returns 409.
      parameters:
        - in: header
          name: Idempotency-Key
