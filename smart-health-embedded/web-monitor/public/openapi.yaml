    post:
      summary: Create an audited 15-minute HTTPS signed URL when the S3 provider is available
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Signed URL or exact replay of the same provider outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageShareResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          description: S3 signed-link provider or canonical metadata repository is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/storage-files/{fileId}/download:
    parameters:
      - in: path
        name: fileId
        required: true
        schema:
          type: string
    get:
      summary: Download an authorized tenant-scoped storage object
      responses:
        "200":
          description: File bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "302":
          description: Redirect to an HTTPS provider URL
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
components:
  responses:
    ErrorResponse:
      description: Standard API error. Top-level message/code fields are kept for old clients.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 160
    OverviewRange:
      in: query
      name: range
      required: false
      description: Calendar range interpreted in timezoneOffsetMinutes.
      schema:
        type: string
        enum: [today, 7d, 30d]
        default: today
    TimezoneOffsetMinutes:
      in: query
      name: timezoneOffsetMinutes
      required: false
      description: Integer minutes east of UTC, for example 420 for Asia/Ho_Chi_Minh.
      schema:
        type: integer
        minimum: -720
        maximum: 840
        default: 0
  schemas:
    OverviewRange:
      type: object
      required: [key, label, startAt, endAt, timezoneOffsetMinutes, bucket]
      properties:
        key:
          type: string
          enum: [today, 7d, 30d]
        label:
          type: string
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        timezoneOffsetMinutes:
          type: integer
          minimum: -720
          maximum: 840
        bucket:
          type: string
          enum: [4h, day]
    OverviewStats:
      type: object
      required: [clinics, workspaces, patientsCount, pendingDoctors, devicesOnline, scansCount, aiJobsFailed, storageBytes, storageUsed]
      properties:
        clinics:
          type: integer
          minimum: 0
        workspaces:
          type: integer
          minimum: 0
        patientsCount:
          type: integer
          minimum: 0
        pendingDoctors:
          type: integer
          minimum: 0
        devicesOnline:
          type: integer
          minimum: 0
        scansCount:
          type: integer
          minimum: 0
          description: Number of scans inside the requested range.
        aiJobsFailed:
          type: integer
          minimum: 0
          description: Failed signal-processing scans inside the requested range.
        storageBytes:
          type: integer
          minimum: 0
        storageUsed:
          type: string
          description: Backward-compatible formatted storage value; clients should format storageBytes.
    OverviewChartPoint:
      type: object
      required: [time, count]
      properties:
        time:
          type: string
        day:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        count:
          type: integer
          minimum: 0
    OverviewChartSlice:
      type: object
      required: [key, name, value, color]
      properties:
        key:
          type: string
          enum: [online, offline, processing, completed, failed, pending]
        name:
          type: string
        value:
          type: integer
          minimum: 0
        color:
          type: string
          description: Backward-compatible presentation hint; clients own semantic theme colors.
    OverviewResponse:
      type: object
      required: [generatedAt, range, stats, measureData, deviceData, aiJobData]
      properties:
        generatedAt:
          type: string
          format: date-time
        range:
          $ref: "#/components/schemas/OverviewRange"
        stats:
          $ref: "#/components/schemas/OverviewStats"
        measureData:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: "#/components/schemas/OverviewChartPoint"
        deviceData:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/OverviewChartSlice"
        aiJobData:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: "#/components/schemas/OverviewChartSlice"
    NotificationChannel:
      type: string
      enum: [in_app, email, push]
    NotificationAudienceType:
      type: string
      enum: [workspace, role, users]
    NotificationDeliveryStatus:
      type: string
      enum: [ready, disabled, unavailable, skipped, no_recipient, no_devices, sent, partial, failed]
    NotificationAudienceInput:
      type: object
      additionalProperties: false
      required: [type, workspaceId]
      properties:
        type:
          $ref: "#/components/schemas/NotificationAudienceType"
        workspaceId:
          type: string
        role:
          type: string
          enum: [workspace_owner, workspace_admin, doctor, nurse, technician, billing, viewer, patient]
        userIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: string
    NotificationCampaignInput:
      type: object
      additionalProperties: false
      required: [title, message, audience, channels]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 180
        message:
          type: string
          minLength: 1
          maxLength: 2000
        type:
          type: string
          enum: [info, warning, success, error]
        audience:
          $ref: "#/components/schemas/NotificationAudienceInput"
        channels:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            $ref: "#/components/schemas/NotificationChannel"
    Notification:
      type: object
      required: [id, organizationId, userId, campaignId, requestedChannels, inAppStatus, emailStatus, pushStatus]
      properties:
        id:
          type: string
        organizationId:
          type: string
        userId:
          type: string
        campaignId:
          type: string
        audienceType:
          $ref: "#/components/schemas/NotificationAudienceType"
        audienceRole:
          type: string
        requestedChannels:
          type: array
          items:
            $ref: "#/components/schemas/NotificationChannel"
        inAppStatus:
          $ref: "#/components/schemas/NotificationDeliveryStatus"
        emailStatus:
          $ref: "#/components/schemas/NotificationDeliveryStatus"
        pushStatus:
          $ref: "#/components/schemas/NotificationDeliveryStatus"
        title:
          type: string
        message:
          type: string
        read:
          type: boolean
        metadata:
          type: object
          additionalProperties: true
    NotificationCampaign:
      type: object
      required: [id, operationId, organizationId, audience, requestedChannels, recipientCount, notificationIds, channelSummary, status, createdAt]
      properties:
        id:
          type: string
        operationId:
          type: string
        organizationId:
          type: string
        audience:
          $ref: "#/components/schemas/NotificationAudienceInput"
        requestedChannels:
          type: array
          items:
            $ref: "#/components/schemas/NotificationChannel"
        recipientCount:
          type: integer
          minimum: 1
          maximum: 200
        notificationIds:
          type: array
          items:
            type: string
        channelSummary:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: integer
        status:
          type: string
          enum: [ready, partial, unavailable]
        createdAt:
          type: string
          format: date-time
    NotificationCampaignResponse:
      type: object
      required: [campaign, notifications, idempotent, channelAvailability]
      properties:
        campaign:
          $ref: "#/components/schemas/NotificationCampaign"
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        notification:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Notification"
        idempotent:
          type: boolean
        channelAvailability:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/NotificationChannelAvailability"
    NotificationChannelAvailability:
      type: object
      required: [available, status, provider]
      properties:
        available:
          type: boolean
        status:
          $ref: "#/components/schemas/NotificationDeliveryStatus"
        provider:
          type: string
        reasonCode:
          type: string
    NotificationOptionsResponse:
      type: object
      required: [audiences, channels]
      properties:
        audiences:
          type: object
          required: [workspaces, roles, users]
          properties:
            workspaces:
              type: array
              items:
                type: object
                required: [id, name, workspaceType]
                properties:
                  id: { type: string }
                  name: { type: string }
                  workspaceType: { type: string }
            roles:
              type: array
              items: { type: string }
            users:
              type: array
              items:
                type: object
                required: [id, workspaceId, name, role]
                properties:
                  id: { type: string }
                  workspaceId: { type: string }
                  name: { type: string }
                  email: { type: string }
                  role: { type: string }
        channels:
          type: object
          required: [in_app, email, push]
          properties:
            in_app:
              $ref: "#/components/schemas/NotificationChannelAvailability"
            email:
              $ref: "#/components/schemas/NotificationChannelAvailability"
            push:
              $ref: "#/components/schemas/NotificationChannelAvailability"
    WorkspaceStatus:
