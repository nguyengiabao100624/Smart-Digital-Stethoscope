            type: integer
      responses:
        "200":
          description: Scan list
  /doctor/scans/start:
    post:
      summary: Start a scan for a patient
      description: Exact retries return the original scan; reusing the key with any different request field returns 409.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            maxLength: 160
      responses:
        "201":
          description: Scan started
  /patient/dashboard:
    get:
      summary: Atomic dashboard for the active patient profile
      description: >
        Requires an active patient account, an operational current workspace
        membership and personal.dashboard.view. The nested dashboard snapshot
        binds every scan and optional device to the authenticated account,
        canonical workspace and active patient profile. Device online means
        authenticated backend presence; blank or captured AI labels are not a
        normal clinical conclusion.
      responses:
        "200":
          description: Active-profile dashboard with legacy compatibility fields
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [dashboard, patient, stats, recentScans]
                properties:
                  dashboard:
                    $ref: "#/components/schemas/PatientDashboardSnapshot"
                  patient:
                    $ref: "#/components/schemas/PatientDashboardPatientSummary"
                  stats:
                    allOf:
                      - $ref: "#/components/schemas/PatientDashboardLegacyStats"
                    nullable: true
                    description: Null when personal.scans.manage is unavailable.
                  recentScans:
                    type: array
                    maxItems: 5
                    items:
                      $ref: "#/components/schemas/PatientDashboardScanSummary"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /patient/scans:
    get:
      summary: List scans belonging to the current patient
      responses:
        "200":
          description: Patient scan list
  /scans:
    get:
      summary: List scans with production filters
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: patientId
          schema:
            type: string
        - in: query
          name: deviceId
          schema:
            type: string
        - in: query
          name: createdFrom
          schema:
            type: string
        - in: query
          name: createdTo
          schema:
            type: string
      responses:
        "200":
          description: Filtered scans
    post:
      summary: Create a durable scan session before chunk upload
      responses:
        "201":
          description: Created scan session
  /scans/start:
    post:
      summary: Start a live device-bound scan
      description: >
        Requires an authenticated online device and an exact caller-supplied
        Idempotency-Key. Exact retries return the same scan with HTTP 200;
        reusing the key with a different actor, workspace, or request payload
        returns 409.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Exact idempotent replay
        "201":
          description: Live scan start accepted for device delivery
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /scans/active/stop:
    post:
      summary: Stop the caller's only active live scan
      description: >
        The response is not emitted until the recording artifact and terminal
        scan state are durable. Exact retries return the original terminal scan.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Durable terminal scan or exact replay
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /scans/{scanId}/stop:
    post:
      summary: Stop and finalize one live scan
      description: >
        Device stop ACK processing and the HTTP response both wait for one
        shared finalization operation. The command cannot become terminal in
        the backend before the recording artifact and scan terminal state are durable.
      parameters:
        - in: path
          name: scanId
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Durable terminal scan or exact idempotent replay
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /scans/{scanId}/audio-chunks:
    post:
      summary: Upload one PCM audio chunk for a scan
      description: >
        Appends one contiguous audio chunk. Reusing the same Idempotency-Key with
        the same scan, sequence, digest and payload returns the original result.
        This remains true after completion closes the upload ledger. Reusing it
        with different input, overwriting a committed sequence, or skipping a
        sequence returns 409. Each chunk is capped at 1 MiB; one scan is capped
        at 32 MiB and 32,768 chunks. Limit violations return 413 before a file
        or ledger row is committed.
      parameters:
        - in: path
          name: scanId
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: true
          description: Stable key for this exact chunk mutation.
          schema:
            type: string
            minLength: 1
            maxLength: 160
        - in: header
          name: X-Chunk-Sequence
          required: true
          description: Zero-based contiguous sequence number. The first chunk is 0.
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 32767
        - in: header
          name: X-Chunk-SHA256
          required: true
          description: SHA-256 digest of the exact request body, encoded as 64 hexadecimal characters.
          schema:
            type: string
            pattern: "^[0-9A-Fa-f]{64}$"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              maxLength: 1048576
      responses:
        "200":
          description: Chunk accepted or exact idempotent replay.
          headers:
            Idempotency-Replayed:
              description: Present with value `true` when the original response is replayed.
              schema:
                type: string
                enum: ["true"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanAudioChunkUploadResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "413":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /scans/{scanId}/complete:
    post:
      summary: Complete chunk upload and process audio
      description: >
        Atomically closes a contiguous upload ledger and starts or completes
        processing. An exact retry with the same Idempotency-Key returns the
        persisted response and does not enqueue duplicate work. A processing
        completion has a 15-minute lease measured from updatedAt; an exact
        retry after expiry may reclaim it atomically with a new internal lease
        token, while retries before expiry report in progress.
      parameters:
        - in: path
          name: scanId
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: true
          description: Stable key for this exact completion mutation.
          schema:
            type: string
            minLength: 1
            maxLength: 160
      responses:
        "200":
          description: Persisted scan state, either newly completed/queued or replayed.
          headers:
            Idempotency-Replayed:
              description: Present with value `true` when the persisted completion response is replayed.
              schema:
                type: string
                enum: ["true"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanAudioCompletionResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "413":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /scans/{scanId}/reprocess:
    post:
      summary: Reprocess one persisted scan artifact
      description: >
        Creates a new processing generation for a new Idempotency-Key. An exact
        retry with the same actor, workspace, scan and key replays the persisted
        generation. Processing intent, generation, artifact fingerprint and run
        identity are durable so a restart cannot silently collapse distinct jobs.
      parameters:
        - in: path
          name: scanId
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: true
          description: Stable key for this exact reprocess mutation.
          schema:
            type: string
            minLength: 1
            maxLength: 160
      responses:
        "200":
          description: Newly accepted/completed generation or exact replay.
          headers:
            Idempotency-Replayed:
              description: Present with value `true` for an exact replay.
              schema:
                type: string
                enum: ["true"]
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /scans/{scanId}/audio-url:
