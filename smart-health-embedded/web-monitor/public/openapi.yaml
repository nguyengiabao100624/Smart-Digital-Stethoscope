                properties:
                  deleted:
                    type: boolean
                    enum: [true]
                  bucketId:
                    type: string
                  idempotent:
                    type: boolean
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /admin/storage-files:
    get:
      summary: List active tenant-scoped storage files
      parameters:
        - $ref: "#/components/parameters/AdminListQ"
        - $ref: "#/components/parameters/AdminListPage"
        - $ref: "#/components/parameters/AdminListLimit"
        - $ref: "#/components/parameters/AdminListSort"
        - in: query
          name: bucket
          schema:
            type: string
        - in: query
          name: type
          schema:
            type: string
      responses:
        "200":
          description: Canonical active file metadata
          headers:
            X-Total-Count:
              $ref: "#/components/headers/AdminListTotal"
            X-Page:
              $ref: "#/components/headers/AdminListPage"
            X-Page-Limit:
              $ref: "#/components/headers/AdminListLimit"
            X-Page-Count:
              $ref: "#/components/headers/AdminListPageCount"
          content:
            application/json:
              schema:
                type: object
                required: [files]
                properties:
                  files:
                    type: array
                    items:
                      $ref: "#/components/schemas/StorageFile"
        "403":
          $ref: "#/components/responses/ErrorResponse"
    post:
      summary: Upload one private file and atomically persist metadata, audit and idempotency outcome
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - in: query
          name: bucket
          required: true
          schema:
            type: string
        - in: query
          name: filename
          required: true
          schema:
            type: string
        - in: query
          name: tags
          schema:
            type: string
            description: Comma-separated tags
        - in: query
          name: organizationId
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Canonical uploaded file or exact replay; failed persistence cleans the object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageFileMutationResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
        "503":
