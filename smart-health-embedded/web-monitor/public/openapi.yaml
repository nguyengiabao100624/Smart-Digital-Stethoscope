        "503":
          $ref: "#/components/responses/ErrorResponse"
  /portal/staff:
    get:
      summary: List the sanitized staff ledger for the active workspace
      description: >
        Requires `workspace.staff.manage` and an operational membership.
        Every member is bound to the exact current workspace and the doctor
        subset contains only approved, active, operational doctors already
        present in the staff ledger. Account credentials, Firebase claims,
        sessions, 2FA material and invitation tokens are excluded.
      responses:
        "200":
          description: Exact workspace-bound staff ledger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalStaffResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
  /portal/staff/{userId}/role:
    patch:
      summary: Change one staff member's role in the active workspace
      description: >
        Requires `workspace.staff.manage`. The membership role is scoped to the
        authenticated workspace and is persisted with an audit event and an
        idempotent receipt. Platform-admin roles and workspace ownership cannot
        be changed through this endpoint.
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceMembershipRoleChangeRequest"
      responses:
        "200":
          description: Exact backend-confirmed role change or idempotent replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMembershipRoleChangeResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /portal/devices/{deviceId}:
    patch:
      summary: Assign one claimed device to a patient in the active workspace
      description: >
        The authenticated membership supplies actor and workspace authority.
        Ownership, audit and the idempotency receipt commit in one repository
        transaction. `/api/portal/devices/{deviceId}` remains a compatibility
        alias during the v1 migration window.
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceAssignmentRequest"
      responses:
        "200":
          description: Exact backend-confirmed assignment or idempotent replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceAssignmentResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /admin/doctors:
    get:
      summary: List approved doctors visible to the authenticated admin actor
      description: Platform administrators see the platform ledger; workspace staff managers remain tenant-scoped.
      parameters:
        - $ref: "#/components/parameters/AdminListQ"
        - $ref: "#/components/parameters/AdminListPage"
        - $ref: "#/components/parameters/AdminListLimit"
        - $ref: "#/components/parameters/AdminListSort"
        - in: query
          name: status
          schema:
            type: string
            enum: [all, active, inactive, unknown]
        - in: query
          name: specialty
          schema:
            type: string
            maxLength: 160
        - in: query
          name: clinic
          schema:
            type: string
            maxLength: 160
      responses:
        "200":
          description: Tenant-authorized doctor page and filter facets calculated from the full authorized ledger
          headers:
            X-Total-Count:
              $ref: "#/components/headers/AdminListTotal"
            X-Page:
              $ref: "#/components/headers/AdminListPage"
            X-Page-Limit:
              $ref: "#/components/headers/AdminListLimit"
            X-Page-Count:
              $ref: "#/components/headers/AdminListPageCount"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [doctors, facets]
                properties:
                  doctors:
                    type: array
                    items:
                      type: object
                  facets:
                    type: object
                    additionalProperties: false
                    required: [specialties, clinics]
                    properties:
                      specialties:
                        type: array
                        uniqueItems: true
                        items:
                          type: string
                      clinics:
                        type: array
                        uniqueItems: true
                        items:
                          type: string
        "403":
          $ref: "#/components/responses/ErrorResponse"
  /admin/clinics:
    get:
      summary: List canonical workspaces
      description: Platform administrators can list all workspaces. Other authorized actors are tenant-scoped. `/admin/workspaces` remains a compatibility alias.
      parameters:
        - in: query
          name: q
          schema:
            type: string
            maxLength: 160
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/WorkspaceStatus"
        - in: query
          name: workspaceType
          schema:
            $ref: "#/components/schemas/WorkspaceType"
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: sort
          schema:
            type: string
            enum: [name:asc, name:desc, status:asc, status:desc, createdAt:asc, createdAt:desc, updatedAt:asc, updatedAt:desc, version:asc, version:desc]
      responses:
        "200":
          description: Workspace page. Pagination is returned in X-Total-Count, X-Page, X-Page-Limit and X-Page-Count headers.
          headers:
            X-Total-Count:
              schema:
                type: integer
            X-Page:
              schema:
                type: integer
            X-Page-Limit:
              schema:
                type: integer
            X-Page-Count:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: object
                required: [workspaces, clinics]
                properties:
                  workspaces:
                    type: array
                    items:
                      $ref: "#/components/schemas/Workspace"
                  clinics:
                    type: array
                    items:
                      $ref: "#/components/schemas/Workspace"
        "403":
          $ref: "#/components/responses/ErrorResponse"
    post:
      summary: Create a pending workspace
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceCreateInput"
      responses:
        "201":
          description: Canonical create receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMutationReceipt"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
  /admin/clinics/{workspaceId}:
    parameters:
      - in: path
        name: workspaceId
        required: true
        schema:
          type: string
    patch:
      summary: Update workspace fields or perform one lifecycle transition
      description: Field updates, owner transfers, and status transitions must be sent as separate operations. Every versioned update requires Idempotency-Key and expectedVersion/If-Match.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - in: header
          name: If-Match
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/WorkspacePatchInput"
                - $ref: "#/components/schemas/WorkspaceTransitionInput"
                - $ref: "#/components/schemas/WorkspaceOwnerTransferInput"
      responses:
        "200":
          description: Canonical update or transition receipt
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WorkspaceMutationReceipt"
                  - $ref: "#/components/schemas/WorkspaceOwnerTransferReceipt"
        "409":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      summary: Archive an inactive workspace
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - in: header
          name: If-Match
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Canonical archive receipt and persisted tombstone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceArchiveReceipt"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /admin/clinics/{workspaceId}/owner-approval:
    post:
      summary: Confirm the pending workspace owner identity
      description: Provider-backed owner identity and active workspace_owner membership are confirmed before the separate pending-to-active transition. The workspace version does not change in this preparation step.
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
        - in: header
          name: If-Match
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion]
              properties:
                expectedVersion:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Canonical owner approval receipt; workspace remains pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceOwnerApprovalReceipt"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /admin/doctor-requests:
    get:
      summary: List doctor approval requests
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [all, pending, approved, rejected, needs_info]
      responses:
        "200":
          description: Doctor approval requests
        "403":
          $ref: "#/components/responses/ErrorResponse"
  /admin/doctor-requests/{requestId}/approve:
    post:
      summary: Approve a doctor account request
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approved doctor request
        "403":
          $ref: "#/components/responses/ErrorResponse"
  /admin/doctor-requests/{requestId}/reject:
    post:
      summary: Reject a doctor account request
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rejected doctor request
        "400":
          $ref: "#/components/responses/ErrorResponse"
  /admin/doctor-requests/{requestId}/request-info:
    post:
      summary: Request additional doctor profile information
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Doctor request moved to needs_info
        "400":
          $ref: "#/components/responses/ErrorResponse"
  /admin/staff-invitations:
    get:
      summary: List tenant-scoped staff invitations
      description: Workspace staff managers are always restricted to their current workspace. Platform user managers may filter by workspace or omit the filter to list all workspaces.
      parameters:
        - in: query
          name: organizationId
          schema:
            type: string
        - in: query
          name: role
          schema:
            type: string
            enum: [workspace_admin, doctor, nurse, technician, billing, viewer]
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, accepted, revoked, expired]
      responses:
        "200":
          description: Staff invitation ledger without acceptance secrets
          content:
            application/json:
              schema:
                type: object
                required: [invitations]
                properties:
                  invitations:
                    type: array
                    items:
                      $ref: "#/components/schemas/StaffInvitation"
        "403":
          $ref: "#/components/responses/ErrorResponse"
    post:
      summary: Create a staff invitation
      description: The raw acceptance token and URL are returned exactly once. An exact idempotent replay returns HTTP 200 and omits both secret fields.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffInvitationCreateInput"
      responses:
        "201":
          description: Invitation created; delivery truth and one-time acceptance material are included
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffInvitationMutationResponse"
        "200":
          description: Exact idempotent replay without acceptance material
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                enum: ["true"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffInvitationMutationResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /admin/staff-invitations/{invitationId}/resend:
    post:
      summary: Rotate and resend a pending or expired staff invitation
      description: Rotates the stored token hash. The new raw token and URL are returned only on the first successful mutation, never on an idempotent replay.
      parameters:
        - in: path
          name: invitationId
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Resent invitation or exact replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffInvitationMutationResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /admin/staff-invitations/{invitationId}/revoke:
    post:
      summary: Revoke a pending or expired staff invitation
      parameters:
        - in: path
          name: invitationId
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        "200":
          description: Revoked invitation or exact replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffInvitationMutationResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /staff-invitations/accept:
    post:
      summary: Accept a staff invitation as the authenticated matching email
      description: Creates the workspace membership, updates the backend account role, consumes the invitation and audits the mutation in one repository transaction.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 32
                  writeOnly: true
                organizationId:
                  type: string
      responses:
        "200":
          description: Accepted invitation or exact idempotent replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffInvitationAcceptanceResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "410":
          $ref: "#/components/responses/ErrorResponse"
  /notifications:
    get:
      summary: List notifications for current backend state
      responses:
        "200":
          description: Notification list
    post:
      summary: Create one tenant-scoped notification campaign
      description: Resolves workspace, role or explicit-user audience to per-user notification rows. Exact retries replay the same campaign and never enqueue provider delivery twice.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationCampaignInput"
      responses:
        "201":
          description: Canonical campaign receipt with separate in-app, email and push states
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationCampaignResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /notifications/options:
    get:
      summary: List notification audiences and runtime channel availability
      description: Returns only active workspaces/users in the caller's authority scope. Missing email or FCM providers are reported as unavailable rather than successful.
      responses:
        "200":
          description: Audience catalog and channel availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationOptionsResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
  /notifications/read-all:
    post:
      summary: Mark all notifications as read
      responses:
        "200":
          description: Updated notification list
  /notifications/unread-count:
    get:
      summary: Return unread notification count
      responses:
        "200":
          description: Unread count
  /notifications/register-device:
    post:
      summary: Atomically bind an FCM token to the current user, workspace, and auth session
      description: >
        The backend derives workspaceId and authSessionId from the current
        authenticated backend session. Client-supplied workspace or session
        identifiers are ignored. Notification protocol version 2 or newer is
        required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fcmToken, notificationProtocolVersion]
              properties:
                fcmToken:
                  type: string
                platform:
                  type: string
                  default: android
                notificationProtocolVersion:
                  type: integer
                  minimum: 2
                appVersion:
                  type: string
                enabled:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Notification device registration
          content:
            application/json:
              schema:
                type: object
                required: [device]
                properties:
                  device:
                    type: object
                    required:
                      - id
                      - userId
                      - workspaceId
                      - fcmToken
                      - authSessionId
                      - notificationProtocolVersion
                      - enabled
                    properties:
                      id:
                        type: string
                      userId:
                        type: string
                      workspaceId:
                        type: string
                      platform:
                        type: string
                      fcmToken:
                        type: string
                      authSessionId:
                        type: string
                      notificationProtocolVersion:
                        type: integer
                      appVersion:
                        type: string
                      enabled:
                        type: boolean
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
  /notifications/unregister-device:
    post:
      summary: Disable the current user, workspace, and auth-session token binding before logout
      responses:
        "200":
          description: Whether the current session still owned and unregistered the exact token binding
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /notifications/{notificationId}/read:
    post:
      summary: Mark one notification as read
      parameters:
        - in: path
          name: notificationId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated notification
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /notifications/{notificationId}:
    delete:
      summary: Delete one notification
      parameters:
        - in: path
          name: notificationId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted notification marker
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /share-targets:
    get:
      summary: List authorized recipients for patient data access
      description: >
        The authenticated current workspace is echoed as the source boundary.
        Returned doctors and workspaces are targets only; they do not grant
        access until a separate audited patient-share mutation succeeds.
      responses:
        "200":
          description: Workspace-bound target snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareTargetsResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
  /patients/{patientId}/shares:
    get:
      summary: List consent and data-access grants for one patient
      description: >
        Returns backend-classified patient consent, direct clinician grants, and
        administrative workspace assignments, including recipient, lifecycle,
        and audit metadata. Revoked and expired records remain visible.
      parameters:
        - in: path
          name: patientId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tenant-scoped patient access ledger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientShareLedgerResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    post:
      summary: Grant patient data access
      description: >
        The backend derives authorityType from the authenticated actor and
        recipient. Clients cannot self-declare patient consent.
      parameters:
        - in: path
          name: patientId
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            maxLength: 160
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientShareMutation"
      responses:
        "201":
          description: Access grant created, or the original result replayed
          headers:
            Idempotency-Replayed:
              description: Present and true when the original mutation result was replayed
              schema:
                type: string
                enum: ["true"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientShareMutationResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /patients/{patientId}/shares/{shareId}:
    delete:
      summary: Revoke one patient consent or data-access grant
      description: >
        Revocation is immutable lifecycle history; the grant remains in the
        ledger with backend-provided revoke actor and timestamp.
      parameters:
        - in: path
          name: patientId
          required: true
          schema:
            type: string
        - in: path
          name: shareId
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            maxLength: 160
      responses:
        "200":
          description: Access grant revoked, or the original result replayed
          headers:
            Idempotency-Replayed:
              description: Present and true when the original mutation result was replayed
              schema:
                type: string
                enum: ["true"]
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PatientShareMutationResponse"
                  - type: object
                    required: [revoked]
                    properties:
                      revoked:
                        type: boolean
                        enum: [true]
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /portal/patients/{patientId}/shares:
    $ref: "#/paths/~1patients~1{patientId}~1shares"
  /portal/patients/{patientId}/shares/{shareId}:
    $ref: "#/paths/~1patients~1{patientId}~1shares~1{shareId}"
  /audit-logs:
    get:
      summary: List the canonical append-only audit ledger
      description: >
        Platform administrators may query an explicit workspace. Workspace
        owners and administrators are restricted to their current operational
        workspace. Free-text search covers canonical identity/action/resource
        columns only and never searches raw metadata.
      parameters:
        - in: query
          name: organizationId
          schema:
            type: string
        - in: query
          name: q
          schema:
            type: string
            maxLength: 160
        - in: query
          name: action
          schema:
            type: string
            maxLength: 120
        - in: query
          name: resourceType
          schema:
            type: string
            maxLength: 120
        - in: query
          name: actorUserId
          schema:
            type: string
            maxLength: 120
        - in: query
          name: startDate
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          schema:
            type: string
            format: date
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: sort
          schema:
            type: string
            enum: [createdAt:desc, createdAt:asc, action:asc, action:desc]
            default: createdAt:desc
      responses:
        "200":
          description: Server-filtered and tenant-scoped audit page
          headers:
            X-Total-Count:
              schema:
                type: integer
            X-Page:
              schema:
                type: integer
            X-Page-Limit:
              schema:
                type: integer
            X-Page-Count:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: object
                required: [logs, pagination]
                properties:
                  logs:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditLog"
                  pagination:
                    $ref: "#/components/schemas/PageMetadata"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
  /access-logs:
    get:
      deprecated: true
      summary: Compatibility alias for the canonical audit ledger
      description: >
        Compatibility-window alias for GET /audit-logs. It returns the same
        tenant-scoped AuditLog records, filters and pagination contract.
      parameters:
        - in: query
          name: organizationId
          schema:
            type: string
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: action
          schema:
            type: string
        - in: query
          name: resourceType
          schema:
            type: string
        - in: query
          name: actorUserId
          schema:
            type: string
        - in: query
          name: startDate
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          schema:
            type: string
            format: date
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: sort
          schema:
            type: string
            enum: [createdAt:desc, createdAt:asc, action:asc, action:desc]
      responses:
        "200":
          description: Same response as GET /audit-logs
          headers:
            X-Total-Count:
              schema:
                type: integer
            X-Page:
              schema:
                type: integer
            X-Page-Limit:
              schema:
                type: integer
            X-Page-Count:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: object
                required: [logs, pagination]
                properties:
                  logs:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditLog"
                  pagination:
                    $ref: "#/components/schemas/PageMetadata"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
  /data/summary:
    get:
      summary: Read measured tenant storage usage
      description: >
        Returns only backend-measured object counts and byte totals visible to
        the authenticated actor. Device-local cache is measured by the native
        client; compatibility cache and quota fields remain zero.
      responses:
        "200":
          description: Tenant-authorized storage summary
          content:
            application/json:
              schema:
                type: object
                required: [storage]
                properties:
                  storage:
                    $ref: "#/components/schemas/StorageSummary"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
  /exports:
    get:
      summary: List immutable export jobs visible to the current actor
      description: >
        Workspace export managers see jobs in their current workspace. Doctors,
        patients and other limited export actors see only jobs they created.
        Platform administrators may select a workspace or query platform-wide.
      parameters:
        - in: query
          name: organizationId
          schema:
            type: string
        - in: query
          name: format
          schema:
            type: string
            enum: [json, csv, xlsx, pdf]
        - in: query
          name: dataset
          schema:
            type: string
            enum: [clinical_bundle, audit_logs]
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, ready, failed]
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: sort
          schema:
            type: string
            enum: [createdAt:desc, createdAt:asc]
            default: createdAt:desc
      responses:
        "200":
          description: Tenant-scoped export jobs without embedded snapshot data
          headers:
            X-Total-Count:
              schema:
                type: integer
            X-Page:
              schema:
                type: integer
            X-Page-Limit:
              schema:
                type: integer
            X-Page-Count:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: object
                required: [exports, pagination]
                properties:
                  exports:
                    type: array
                    items:
                      $ref: "#/components/schemas/ExportJob"
                  pagination:
                    $ref: "#/components/schemas/PageMetadata"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
    post:
      summary: Create an immutable tenant-scoped export artifact
      description: >
        The backend freezes the authorized dataset at creation time, renders
        JSON, CSV, XLSX or PDF, stores renderer and SHA-256 metadata, and audits
        the mutation atomically. Workspace managers may export the workspace;
        doctors are restricted to patients with active grants; patients are
        restricted to owned/dependent profiles. Audit export requires a
        dedicated platform.audit.export or workspace.audit.export capability
        and must be narrowed to at most 50,000 matching ledger rows.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            maxLength: 160
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                format:
                  type: string
                  enum: [json, csv, xlsx, pdf]
                  default: json
                dataset:
                  type: string
                  enum: [clinical_bundle, audit_logs]
                  default: clinical_bundle
                organizationId:
                  type: string
                  description: >
                    Platform administrators may target a workspace. They may
                    omit this field only for a platform-global audit_logs
                    export. Other actors are restricted to the current
                    operational workspace.
                filters:
                  type: object
                  description: >
                    Server-applied filters. Audit exports accept q, action,
                    resourceType, actorUserId, startDate, endDate and sort.
                  properties:
                    q:
                      type: string
                      maxLength: 160
                    action:
                      type: string
                      maxLength: 120
                    resourceType:
                      type: string
                      maxLength: 120
                    actorUserId:
                      type: string
                      maxLength: 120
                    startDate:
                      type: string
                      format: date
                    endDate:
                      type: string
                      format: date
                    sort:
                      type: string
                      enum: [createdAt:desc, createdAt:asc, action:asc, action:desc]
                startDate:
                  type: string
                  format: date
                  deprecated: true
                  description: Compatibility alias for filters.startDate.
                endDate:
                  type: string
                  format: date
                  deprecated: true
                  description: Compatibility alias for filters.endDate.
                includeAudio:
                  type: boolean
                  default: true
                includeReports:
                  type: boolean
                  default: true
                includeHistory:
                  type: boolean
                  default: true
      responses:
        "201":
          description: Export snapshot created, or the original result replayed for the same idempotency key
          headers:
            Idempotency-Replayed:
              description: Present and true when the original mutation result was replayed
              schema:
                type: string
                enum: ["true"]
          content:
            application/json:
              schema:
                type: object
                required: [export, replayed]
                properties:
                  export:
                    $ref: "#/components/schemas/ExportJob"
                  replayed:
                    type: boolean
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "413":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
  /exports/download/{exportId}:
    get:
      summary: Download the immutable artifact bound to an export job
      description: >
        The actor must still have export capability and job visibility. The
        backend regenerates the artifact with the recorded renderer version,
        verifies its SHA-256 when present, and audits each successful download.
      parameters:
        - in: path
          name: exportId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Creation-time JSON, CSV, XLSX or PDF artifact; the download is audited
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, no-store
            Content-Disposition:
              schema:
                type: string
            X-Shcare-Artifact-SHA256:
              schema:
                type: string
                pattern: "^[0-9a-f]{64}$"
            X-Shcare-Renderer-Version:
              schema:
                type: string
                enum: [shcare.export-artifact.v1]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportSnapshot"
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /admin/packages:
    get:
      summary: List the canonical Platform Admin package ledger, including archived packages
      parameters:
        - $ref: "#/components/parameters/AdminListQ"
        - $ref: "#/components/parameters/AdminListPage"
        - $ref: "#/components/parameters/AdminListLimit"
        - $ref: "#/components/parameters/AdminListSort"
        - in: query
          name: status
          schema:
            type: string
            enum: [all, active, archived]
      responses:
        "200":
          description: Canonical service package ledger
          headers:
            X-Total-Count:
              $ref: "#/components/headers/AdminListTotal"
            X-Page:
              $ref: "#/components/headers/AdminListPage"
            X-Page-Limit:
              $ref: "#/components/headers/AdminListLimit"
            X-Page-Count:
              $ref: "#/components/headers/AdminListPageCount"
          content:
            application/json:
              schema:
                type: object
                required: [packages]
                properties:
                  packages:
                    type: array
                    items:
                      $ref: "#/components/schemas/ServicePackage"
        "403":
          $ref: "#/components/responses/ErrorResponse"
    post:
      summary: Create one service package as Platform Admin
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ServicePackageMutationInput"
                - anyOf:
                    - required: [name]
                    - required: [packageName]
      responses:
        "201":
          description: Created package or exact replay of the original outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicePackageMutationResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /admin/packages/{packageId}:
    parameters:
      - in: path
        name: packageId
        required: true
        schema:
          type: string
    patch:
      summary: Update or explicitly reactivate/archive a service package
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServicePackageMutationInput"
      responses:
        "200":
          description: Updated package or exact replay of the original outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicePackageMutationResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      summary: Archive an unassigned package without deleting its ledger row
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Canonical archived package outcome
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ServicePackageMutationResponse"
                  - type: object
                    required: [archived, packageId]
                    properties:
                      archived:
                        type: boolean
                        enum: [true]
                      packageId:
                        type: string
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /admin/storage-stats:
    get:
      summary: Read tenant-scoped storage facts without synthetic quota or policy claims
