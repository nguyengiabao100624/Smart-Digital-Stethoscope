[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

board_build.flash_size = 16MB
board_build.flash_mode = dio

lib_deps =
  gilmaimon/ArduinoWebsockets
  bodmer/TFT_eSPI

build_flags =
  ; Keep WiFi/device credentials out of source code. Add local values when flashing:
  ; -D SMART_HEALTH_WIFI_SSID=\"YourWiFi\"
  ; -D SMART_HEALTH_WIFI_PASS=\"YourPassword\"
  ; Production cloud defaults already point to Render with WSS:
  ; -D SMART_HEALTH_WS_HOST=\"smart-health-api-xj0a.onrender.com\"
  ; -D SMART_HEALTH_WS_PORT=443
  ; -D SMART_HEALTH_WS_TLS=1
  ; Add the device id/secret issued by Web Admin when available:
  ; -D SMART_HEALTH_DEVICE_ID=\"smarthealth-INMP441\"
  ; -D SMART_HEALTH_DEVICE_SECRET=\"device-secret-issued-by-web-admin\"
  ; Local development fallback:
  ; -D SMART_HEALTH_WS_HOST=\"192.168.1.100\"
  ; -D SMART_HEALTH_WS_PORT=3000
  ; -D SMART_HEALTH_WS_TLS=0
  -D USER_SETUP_INFO_ONLY
  -D USER_SETUP_LOADED
  -D ST7796_DRIVER
  -D TFT_CS=4
  -D TFT_RST=5
  -D TFT_DC=6
  -D TFT_MOSI=7
  -D TFT_SCLK=15
  -D TFT_MISO=17
  -D TFT_BL=16
  -D TOUCH_CS=8
  -D TOUCH_MOSI=3
  -D TOUCH_MISO=46
  -D TOUCH_CLK=18
  -D LOAD_GLCD
  -D LOAD_FONT2
  -D LOAD_FONT4
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=20000000
  -D SPI_TOUCH_FREQUENCY=2500000
