[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

; Keep WiFi/server credentials out of source code.
; For local flashing, copy these examples into your own ignored local command or
; uncomment and replace values before upload:
; build_flags =
;   -DSMART_HEALTH_WIFI_SSID=\"YourWiFi\"
;   -DSMART_HEALTH_WIFI_PASS=\"YourPassword\"
;   -DSMART_HEALTH_BACKEND_HOST=\"api.smart-health.example.com\"
;   -DSMART_HEALTH_BACKEND_PORT=443
;   -DSMART_HEALTH_BACKEND_TLS=1
;   -DSMART_HEALTH_DEVICE_ID=\"smarthealth-ABCDEF\"
;   -DSMART_HEALTH_DEVICE_SECRET=\"device-credential-securely-enrolled-at-factory\"
;   -DSMART_HEALTH_FIRMWARE_VERSION=\"1.0.1\"
; Optional local UDP fallback for development only:
;   -DSMART_HEALTH_AUDIO_HOST=\"192.168.1.100\"
;   -DSMART_HEALTH_AUDIO_UDP_PORT=3001
; Optional LAN ArduinoOTA for development only:
;   -DSMART_HEALTH_ENABLE_LAN_OTA=1
;   -DSMART_HEALTH_OTA_PASSWORD=\"local-dev-ota-password\"
; Configure the board's verified physical setup/reset input before field use:
;   -DSMART_HEALTH_FACTORY_RESET_PIN=<board-specific-gpio>
; Optional recovery AP lifetime override (default: 600000 ms):
;   -DSMART_HEALTH_SETUP_PORTAL_TTL_MS=600000

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.flash_mode = dio
board_build.partitions = partitions_16mb_ota.csv

; Canonical hardware builds are production-profile builds. Missing WSS/TLS,
; CA trust or device credentials fail closed at runtime.
build_flags =
  -DSMART_HEALTH_PRODUCTION_PROFILE=1
  -DSMART_HEALTH_ENABLE_DEVELOPMENT_WS=0
  -DSMART_HEALTH_ENABLE_DEVELOPMENT_UDP=0

lib_deps =
  gilmaimon/ArduinoWebsockets
  bblanchon/ArduinoJson @ ^7.4.2
  h2zero/NimBLE-Arduino @ ^2.3.6

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
lib_deps =
  bblanchon/ArduinoJson @ ^7.4.2

[env:esp32-s3-development]
extends = env:esp32-s3-devkitm-1
; A local HIL build may inject its short-lived credential header only through
; this development environment. The pre-build hook rejects paths outside the
; OS temporary directory, and production builds never load it.
extra_scripts = pre:scripts/inject_hil_config.py
build_unflags =
  -DSMART_HEALTH_PRODUCTION_PROFILE=1
  -DSMART_HEALTH_ENABLE_DEVELOPMENT_WS=0
  -DSMART_HEALTH_ENABLE_DEVELOPMENT_UDP=0
build_flags =
  -DSMART_HEALTH_PRODUCTION_PROFILE=0
  -DSMART_HEALTH_ENABLE_DEVELOPMENT_WS=1
  -DSMART_HEALTH_ENABLE_DEVELOPMENT_UDP=1
  ; HIL-only framework diagnostics make a real TLS-chain failure observable
  ; on COM9. This is intentionally absent from canonical production builds.
  -DCORE_DEBUG_LEVEL=5

[env:esp32-s3-ota]
extends = env:esp32-s3-devkitm-1
upload_protocol = espota
; Replace after the first wired flash and setup portal save.
; Examples:
; upload_port = smarthealth-ABCDEF.local
; upload_port = 192.168.1.42
; Keep the real OTA password out of source. Temporarily uncomment locally only:
; upload_flags =
;   --auth=replace-with-device-ota-password
