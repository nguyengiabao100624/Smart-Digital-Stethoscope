        "409":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /devices/{deviceId}/rotate-secret:
    post:
      summary: Start a backend-generated two-phase device credential rotation
      description: >
        Operators cannot submit credential material. HTTP 202 confirms only that
        the backend generated, durably recorded and attempted delivery of a
        session-wrapped candidate. Rotation is complete only when `confirmed` is
        true after the device reconnects with that candidate.
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{2,62}$"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceCredentialRotationRequest"
      responses:
        "202":
          description: Public two-phase rotation state; candidate credential and verification material are excluded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCredentialRotationReceipt"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /devices/{deviceId}/ota:
    post:
      summary: Create and deliver one server-signed OTA command
      description: >
        Platform Admin selects a firmware artifact or supplies canonical HTTPS
        metadata. The backend validates target, version and SHA-256, signs the
        private device manifest and keeps its URL, signature and download token
        out of this public receipt. HTTP 202 is not installation success;
        `confirmed` requires a later new authenticated session, the requested
        firmware version and an explicit device-confirmed boot-health outcome.
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{2,62}$"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceOtaRequest"
      responses:
        "202":
          description: Durable signed-manifest command receipt and current transport outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceOtaReceipt"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /devices/{deviceId}/ota/{otaId}/firmware:
    get:
      summary: Download one private OTA artifact using its transient device bearer
      description: >
        This endpoint is consumed only by the authenticated target device. The
        transient bearer is carried in the Authorization header, is never placed
        in the URL, public receipts or logs, and becomes invalid when the device is
        revoked, the ownership/OTA binding changes, the grant expires, or the OTA
        lifecycle reaches a terminal state. Missing or malformed legacy expiry is
        denied and terminalized together with the matching command. Artifact bytes
        are streamed through a bounded backend proxy and are never redirected.
      security:
        - otaDownloadBearer: []
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{2,62}$"
        - in: path
          name: otaId
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Bounded firmware bytes for the exact active device/OTA binding
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: The bearer or canonical device/OTA binding is invalid
        "409":
          description: The immutable storage size, checksum or artifact binding changed
        "410":
          description: The OTA download grant expired and was terminally revoked
        "413":
          description: The firmware exceeds the configured bounded download size
