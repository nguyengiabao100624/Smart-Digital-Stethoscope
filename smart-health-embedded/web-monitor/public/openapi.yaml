            type: string
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: action
          schema:
            type: string
        - in: query
          name: resourceType
          schema:
            type: string
        - in: query
          name: actorUserId
          schema:
            type: string
        - in: query
          name: startDate
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          schema:
            type: string
            format: date
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: sort
          schema:
            type: string
            enum: [createdAt:desc, createdAt:asc, action:asc, action:desc]
      responses:
        "200":
          description: Same response as GET /audit-logs
          headers:
            X-Total-Count:
              schema:
                type: integer
            X-Page:
              schema:
                type: integer
            X-Page-Limit:
              schema:
                type: integer
            X-Page-Count:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: object
                required: [logs, pagination]
                properties:
                  logs:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditLog"
                  pagination:
                    $ref: "#/components/schemas/PageMetadata"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
  /exports:
    get:
      summary: List immutable export jobs visible to the current actor
      description: >
        Workspace export managers see jobs in their current workspace. Doctors,
        patients and other limited export actors see only jobs they created.
        Platform administrators may select a workspace or query platform-wide.
      parameters:
        - in: query
          name: organizationId
          schema:
            type: string
        - in: query
          name: format
          schema:
            type: string
            enum: [json, csv, xlsx, pdf]
        - in: query
          name: dataset
          schema:
            type: string
            enum: [clinical_bundle, audit_logs]
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, ready, failed]
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: sort
          schema:
            type: string
            enum: [createdAt:desc, createdAt:asc]
            default: createdAt:desc
      responses:
        "200":
          description: Tenant-scoped export jobs without embedded snapshot data
          headers:
            X-Total-Count:
              schema:
                type: integer
            X-Page:
              schema:
                type: integer
            X-Page-Limit:
              schema:
                type: integer
            X-Page-Count:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: object
                required: [exports, pagination]
                properties:
                  exports:
                    type: array
                    items:
                      $ref: "#/components/schemas/ExportJob"
                  pagination:
                    $ref: "#/components/schemas/PageMetadata"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
    post:
      summary: Create an immutable tenant-scoped export artifact
      description: >
        The backend freezes the authorized dataset at creation time, renders
        JSON, CSV, XLSX or PDF, stores renderer and SHA-256 metadata, and audits
        the mutation atomically. Workspace managers may export the workspace;
        doctors are restricted to patients with active grants; patients are
        restricted to owned/dependent profiles. Audit export requires a
        dedicated platform.audit.export or workspace.audit.export capability
        and must be narrowed to at most 50,000 matching ledger rows.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            maxLength: 160
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                format:
                  type: string
                  enum: [json, csv, xlsx, pdf]
                  default: json
                dataset:
                  type: string
                  enum: [clinical_bundle, audit_logs]
                  default: clinical_bundle
                organizationId:
                  type: string
                  description: >
                    Platform administrators may target a workspace. They may
                    omit this field only for a platform-global audit_logs
                    export. Other actors are restricted to the current
                    operational workspace.
                filters:
                  type: object
                  description: >
                    Server-applied filters. Audit exports accept q, action,
                    resourceType, actorUserId, startDate, endDate and sort.
                  properties:
                    q:
                      type: string
                      maxLength: 160
                    action:
                      type: string
                      maxLength: 120
                    resourceType:
                      type: string
                      maxLength: 120
                    actorUserId:
                      type: string
                      maxLength: 120
                    startDate:
                      type: string
                      format: date
                    endDate:
                      type: string
                      format: date
                    sort:
                      type: string
                      enum: [createdAt:desc, createdAt:asc, action:asc, action:desc]
                startDate:
                  type: string
                  format: date
                  deprecated: true
                  description: Compatibility alias for filters.startDate.
                endDate:
                  type: string
                  format: date
                  deprecated: true
                  description: Compatibility alias for filters.endDate.
                includeAudio:
                  type: boolean
                  default: true
                includeReports:
                  type: boolean
                  default: true
                includeHistory:
                  type: boolean
                  default: true
      responses:
        "201":
          description: Export snapshot created, or the original result replayed for the same idempotency key
          headers:
            Idempotency-Replayed:
              description: Present and true when the original mutation result was replayed
              schema:
                type: string
                enum: ["true"]
          content:
            application/json:
              schema:
                type: object
                required: [export, replayed]
                properties:
                  export:
                    $ref: "#/components/schemas/ExportJob"
                  replayed:
                    type: boolean
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "413":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
  /exports/download/{exportId}:
    get:
      summary: Download the immutable artifact bound to an export job
      description: >
        The actor must still have export capability and job visibility. The
        backend regenerates the artifact with the recorded renderer version,
        verifies its SHA-256 when present, and audits each successful download.
      parameters:
        - in: path
          name: exportId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Creation-time JSON, CSV, XLSX or PDF artifact; the download is audited
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, no-store
            Content-Disposition:
              schema:
                type: string
            X-Shcare-Artifact-SHA256:
              schema:
                type: string
                pattern: "^[0-9a-f]{64}$"
            X-Shcare-Renderer-Version:
              schema:
                type: string
                enum: [shcare.export-artifact.v1]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportSnapshot"
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
