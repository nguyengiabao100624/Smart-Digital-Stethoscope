          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicePairReceipt"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /devices/{deviceId}:
    get:
      summary: Read one sanitized device and its current OTA lifecycle when present
      description: >
        The public device projection never contains claim material, credentials,
        signed firmware URLs, download tokens or signing keys. `device.ota` is
        absent when no OTA lifecycle exists; that absence is not a successful OTA.
        `/api/devices/{deviceId}` remains a compatibility alias during the v1 window.
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{2,62}$"
      responses:
        "200":
          description: Sanitized device status, including a reconciled OTA status when one exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceOtaStatusResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /devices/{deviceId}/setup-session:
    post:
      summary: Open one short-lived encrypted ESPTouch V2 setup session
      description: >
        Requires DeviceManage authority for the already-owned device. The
        response is no-store and contains only derived, short-lived ESPTouch V2
        AES-128 material; it never contains the device secret or target Wi-Fi
        credentials. An offline device is valid because it listens for
        SmartConfig after boot. Unsupported clients receive HTTP 426.
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{2,62}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceWifiSetupRequest"
      responses:
        "200":
          description: Short-lived ESPTouch V2 setup material with Cache-Control no-store
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceWifiSetupResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "426":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /devices/{deviceId}/commands:
    get:
      summary: List the bounded command lifecycle for one authorized device
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{2,62}$"
      responses:
        "200":
          description: At most one hundred sanitized device command records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCommandListResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    post:
      summary: Accept one safe generic Platform Admin device command
      description: >
        This endpoint accepts only `restart`, `wifi.status` and `device.lock`.
        Wi-Fi credentials must use the foreground ESPTouch V2 broadcast flow and a remote
        `wifi.update` returns `DEVICE_WIFI_UPDATE_LOCAL_SETUP_REQUIRED` before
        reservation or delivery. Revocation, credential rotation, OTA and clinical audio
        commands return `DEVICE_COMMAND_SPECIALIZED_ROUTE_REQUIRED` and must use
        their dedicated audited workflows. HTTP 202 means backend acceptance and
        a recorded transport outcome, not that the device applied the command.
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{2,62}$"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericSafeDeviceCommandRequest"
      responses:
        "202":
          description: Backend-accepted command and current delivery state; poll by command ID for device acknowledgement or terminal result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericDeviceCommandReceipt"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /devices/{deviceId}/commands/{commandId}:
    get:
      summary: Read one device-reported command lifecycle
      description: "`applied`, `failed` and `expired` are terminal. Earlier states must not be announced as device success."
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{2,62}$"
        - in: path
          name: commandId
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Current sanitized command state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCommandStatusResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /devices/{deviceId}/revoke:
    post:
      summary: Revoke one device through the audited Platform Admin workflow
      description: >
        Success is returned only after ownership revocation and audit commit.
        The backend closes the active device socket and interrupts its recording;
        a generic `device.revoke` command is rejected by the generic endpoint.
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{2,62}$"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Committed revocation receipt or exact idempotent replay
