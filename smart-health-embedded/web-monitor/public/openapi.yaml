        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /devices/pair:
    post:
      summary: Claim a provisioned device and report its authenticated-online state truthfully
      description: >
        `organizationId` is the exact active-workspace precondition captured by
        the client. It does not grant authority: the backend requires the same
        canonical current workspace and an operational exact membership, and
