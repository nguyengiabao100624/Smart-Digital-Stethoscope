            application/json:
              schema:
                $ref: "#/components/schemas/DeviceRevokeReceipt"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /devices/{deviceId}/release:
    post:
      summary: Release one owned device from the current account
      description: >
        This tenant-scoped, idempotent workflow removes the current owner and
        patient assignment, returns the device to the provisioned state, closes
        its active socket and retains clinical and audit history. It is distinct
        from Platform Admin revocation and never hard-deletes the device record.
      parameters:
        - in: path
