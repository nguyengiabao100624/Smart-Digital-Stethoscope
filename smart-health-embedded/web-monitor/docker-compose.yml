services:
  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      mosquitto:
        condition: service_started
    environment:
      NODE_ENV: development
      DATA_BACKEND: postgres
      DATABASE_URL: postgresql://smart_health:smart_health_dev@postgres:5432/smart_health
      REDIS_URL: redis://redis:6379/0
      MQTT_URL: mqtt://mosquitto:1883
      OBJECT_STORAGE_PROVIDER: s3
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      OBJECT_STORAGE_BUCKET: smart-health-audio
      PORT: 3000
      AUDIO_UDP_PORT: 3001
      AUTH_MODE: demo
      FIREBASE_AUTH_ENABLED: "false"
      CORS_ORIGIN: "*"
    ports:
      - "3000:3000"
      - "3001:3001/udp"
    volumes:
      - smart_health_data:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smart_health
      POSTGRES_USER: smart_health
      POSTGRES_PASSWORD: smart_health_dev
    ports:
      - "5432:5432"
    volumes:
      - smart_health_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_health -d smart_health"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - smart_health_redis:/data

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: smarthealth
      MINIO_ROOT_PASSWORD: smarthealth_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - smart_health_minio:/data

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  smart_health_data:
  smart_health_postgres:
  smart_health_redis:
  smart_health_minio:
